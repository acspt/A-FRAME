<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Spinosaurus NFT</title>
    <!-- A-Frame e AR.js (versão com image tracking / NFT) em versões fixas -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar-nft.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene
      vr-mode-ui="enabled: false;"
      renderer="logarithmicDepthBuffer: true; precision: medium;"
      embedded
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
      <!-- a-nft é a âncora da imagem detetada; o url termina no nome dos descritores, sem extensão -->
      <!-- o url tem de ser absoluto: o AR.js carrega os descritores a partir da raiz do site -->
      <a-nft
        type="nft"
        url="https://acspt.github.io/A-FRAME/ar/image/detect-spinosaurus-arjs/assets/nft/target"
        smooth="true"
        smoothCount="10"
        smoothTolerance=".01"
        smoothThreshold="5">
        <!-- conteúdo mostrado sobre a imagem: o modelo glTF do spinosaurus -->
        <a-entity
          gltf-model="url(assets/spinosaurus.glb)"
          scale="5 5 5"
          position="150 300 -100">
        </a-entity>
      </a-nft>
      <!-- câmara estática; o AR.js move o conteúdo de acordo com a imagem detetada -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
