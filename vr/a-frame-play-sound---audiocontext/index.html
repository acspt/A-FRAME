<html>
  <head>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="script.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="start-screen">
      <div id="play-btn"></div>
      <div id="play-text">play game</div>
    </div>
    <a-scene id="myScene">
      <a-assets>
        <img
          id="sky"
          crossorigin="anonymous"
          src="https://content.codecademy.com/courses/learn-a-frame/building-the-environment/mountains2.jpg"
        />
        <img
          crossorigin="anonymous"
          id="grass"
          src="https://upload.wikimedia.org/wikipedia/commons/f/f4/Light_green_oats_field.jpg"
        />
        <a-asset-item
          crossorigin="anonymous"
          id="codey"
          src="https://content.codecademy.com/courses/learn-a-frame/building-the-environment/codey.gltf"
        ></a-asset-item>

        <audio
          crossorigin="anonymous"
          id="music"
          src="assets/space-158081.wav"
          preload="auto"
        ></audio>
      </a-assets>

      <a-sky src="#sky"></a-sky>
      <a-plane src="#grass" rotation="-90 0 0" width="20" height="20"></a-plane>
      <a-entity
        text="value: Welcome!; color: #FFD500; align: center"
        position="0 3 -4"
        scale="6 6 6"
        animation="property: object3D.position.y;
          to: 3.2; 
          dir: alternate; 
          dur: 2000; 
          loop: true"
      ></a-entity>
      <a-entity
        gltf-model="#codey"
        position="0 2 -4"
        scale="0.5 0.5 0.5"
        animation="property: object3D.position.y;
          to: 2.2; 
          dir: alternate; 
          dur: 2000; 
          loop: true"
      ></a-entity>
      <a-light type="point" intensity="2" position="2 4 4"></a-light>
      <!-- Add entity here: -->

      <a-sound src="#music" autoplay="true"></a-sound>
    </a-scene>
  
    <!-- Bibliotecas usadas nesta página (clicar para abrir a lista) -->
    <details class="bibliotecas-usadas" style="position:fixed;bottom:10px;left:10px;z-index:9999;max-width:340px;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,0.7);color:#fff;font:12px/1.4 Arial,sans-serif">
      <summary style="cursor:pointer">&#8505;&#65039; Bibliotecas</summary>
      <ul style="margin:6px 0 0;padding-left:16px">
        <li><a href="https://aframe.io" target="_blank" rel="noopener" style="color:#87ceeb">A-Frame</a> 1.6.0</li>
      </ul>
    </details>
</body>
</html>
