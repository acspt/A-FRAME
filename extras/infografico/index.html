<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Infográfico em AR: marcador Hiro</title>
    <style>
      /* Por cima de uma esfera, mostra a mão de clicar (pointer) em vez da mão de arrastar */
      .a-canvas.a-mouse-cursor-hover:hover {
        cursor: pointer !important;
      }
    </style>
    <!-- A-Frame e AR.js em versões fixas -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <!-- arjs sourceType: webcam: usa a câmara do dispositivo para procurar marcadores -->
    <!-- cursor rayOrigin: mouse: cliques do rato e toques no ecrã chegam às entidades como eventos click -->
    <!-- raycaster objects: .esfera: só as esferas recebem cliques -->
    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; debugUIEnabled: false;"
      cursor="rayOrigin: mouse"
      raycaster="objects: .esfera"
    >
      <!-- a-marker preset: hiro: procura o marcador Hiro.
           detetar-marcador (script.js): quando o deteta, põe visible = true e cria as esferas. -->
      <a-marker preset="hiro" detetar-marcador>
        <!-- caixa pousada em cima do marcador; o AR.js esconde-a quando perde o marcador -->
        <a-box
          id="caixa-maker"
          position="0 0.5 0"
          width="1"
          height="1"
          depth="1"
          color="tomato"
        ></a-box>
      </a-marker>

      <!-- câmara (sem entidades dentro).
           position 0 0 0: no AR.js a câmara tem de ficar na origem.
           wasd-controls-enabled: false: as teclas W A S D não mexem a câmara.
           look-controls: roda a câmara com o rato (PC) ou com o giroscópio (telemóvel);
           assim as esferas ficam paradas no espaço em vez de acompanharem o ecrã.
           touchEnabled: false: no telemóvel, arrastar o dedo não roda a câmara,
           para os toques chegarem às esferas.
           corrigir-cliques (script.js): faz o rato e os toques acertarem nas esferas. -->
      <a-camera
        position="0 0 0"
        wasd-controls-enabled="false"
        look-controls="touchEnabled: false"
        corrigir-cliques
      ></a-camera>
          <a-box
            id="caixa"
            position="1 0.5 -10"
            width="2s"
            height="1"
            depth="1"
            color="green"
          ></a-box>
    </a-scene>

    <!-- código do projeto (componente detetar-marcador), no fim da página -->
    <!-- ?v=4: muda este número sempre que alteras o scripts.js, para o browser
         não usar uma cópia antiga guardada em cache -->
    <script src="script.js?v=16"></script>
  </body>
</html>
