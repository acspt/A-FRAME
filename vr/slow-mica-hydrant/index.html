<!DOCTYPE html>
<html>
  <head>
    <title>Testar o A-Frame</title>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="//cdn.rawgit.com/donmccurdy/aframe-extras/v4.0.2/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene animation__a1="property: rotation; to: 0 360 0; dur: 5000; loop: true">
      <a-box
        position="-1 1 2"
        rotation="45 45 0"
        color="#4CC3D9"
        shadow
      ></a-box>
      <a-text value="Olha para Cima" color="black" position="-1 2 -3"></a-text>
      <a-text
        value="Esfera com Textura"
        rotation="0 90 0"
        color="black"
        position="-5 2 3"
      ></a-text>
      <a-text
        value="Luz que Pisca na Agua"
        rotation="180 90 90"
        color="black"
        position="5 2.5 2"
      ></a-text>
      <a-text
        value="Agora para a Esquerda"
        color="black"
        position="-1 5 -3"
      ></a-text>
      <a-sphere
        position="-5 0.5 2"
        radius="1.0"
        src="assets/aerial_rocks_02_diff_1k.jpg"
      ></a-sphere>
      <a-ocean position="0 0 -5" width="40" depth="40" opacity="0.8"></a-ocean>
      <a-entity portal="to: #destino; color: #FF5733"></a-entity>
      <a-sphere
        id="destino"
        position="3 1 -6"
        radius="1"
        color="#6C5CE7"
      ></a-sphere>
      <a-camera></a-camera>
      <a-sky color="blue"></a-sky>
      <a-entity inspector></a-entity>
      <a-light type="ambient" intensity="1" color="#445451"></a-light>
      <a-light type="point" intensity="1" position="5 0 2" shadow></a-light>
      <a-entity
        gltf-model="url(modelo.glb)"
        position="0 0 -5"
        scale="0.5 0.5 0.5"
      ></a-entity>
      <a-entity
        voxel-paint="voxelSize: 0.1; colorPalette: #FF5733, #6C5CE7, #EF2D5E"
      ></a-entity>
      <a-entity
        id="cursor"
        cursor="fuse: true; fuseTimeout: 500"
        raycaster="objects: .clickable"
      ></a-entity>
      <a-box
        class="clickable"
        position="1 2 -4"
        color="red"
        scale="0.5 0.5 0.5"
      ></a-box>
      
      <a-entity
        sound="src: assets/X2Download.app---FREE-Lofi-Type-Beat---F.wav; autoplay: true; loop: true"
      ></a-entity>
      <a-sphere
        position="2 0 -4"
        radius="0.5"
        color="blue"
        proximity="target: #proximidade; radius: 2;"
      ></a-sphere>
      <a-box id="proximidade" position="2 0 -7" color="green"></a-box>
    </a-scene>
  
    <!-- Bibliotecas usadas nesta página (clicar para abrir a lista) -->
    <details class="bibliotecas-usadas" style="position:fixed;bottom:10px;left:10px;z-index:9999;max-width:340px;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,0.7);color:#fff;font:12px/1.4 Arial,sans-serif">
      <summary style="cursor:pointer">&#8505;&#65039; Bibliotecas</summary>
      <ul style="margin:6px 0 0;padding-left:16px">
        <li><a href="https://aframe.io" target="_blank" rel="noopener" style="color:#87ceeb">A-Frame</a> 1.0.4</li>
        <li><a href="https://github.com/c-frame/aframe-extras" target="_blank" rel="noopener" style="color:#87ceeb">aframe-extras</a> 4.0.2</li>
      </ul>
    </details>
</body>
</html>
