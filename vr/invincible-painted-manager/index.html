<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent('change-color-on-collision', {
        init: function() {
          const box = this.el;

          box.addEventListener('collisionstart', () => {
            box.setAttribute('color', 'green');
          });

          box.addEventListener('collisionend', () => {
            box.setAttribute('color', 'red');
          });
        }
      });
    </script>
  </head>
  <body>
    <a-scene>
      <a-box id="myBox" collision-filter="collisionForces: true" color="red" change-color-on-collision></a-box>
      <a-sphere position="0 1 -2"></a-sphere>

      <!-- Camera and lighting -->
      <a-entity position="0 1.8 3">
        <a-camera></a-camera>
      </a-entity>
      <a-light type="ambient" color="#445451"></a-light>
      <a-light type="point" intensity="2" position="2 4 4"></a-light>
    </a-scene>
  
    <!-- Bibliotecas usadas nesta página (clicar para abrir a lista) -->
    <details class="bibliotecas-usadas" style="position:fixed;bottom:10px;left:10px;z-index:9999;max-width:340px;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,0.7);color:#fff;font:12px/1.4 Arial,sans-serif">
      <summary style="cursor:pointer">&#8505;&#65039; Bibliotecas</summary>
      <ul style="margin:6px 0 0;padding-left:16px">
        <li><a href="https://aframe.io" target="_blank" rel="noopener" style="color:#87ceeb">A-Frame</a> 1.4.0</li>
      </ul>
    </details>
</body>
</html>
