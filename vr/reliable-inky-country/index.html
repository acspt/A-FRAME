<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obra de Arte Interativa</title>
    <style>
        /* Regras CSS para estilização */
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            width: 100vw;
            height: 100vh;
        }
        /* Adicione mais regras CSS conforme necessário */
    </style>
</head>
<body>
    <a-scene>
        <!-- Componentes A-Frame para construção do cenário 3D -->
        <a-sky color="#3498db"></a-sky>
        <a-box position="-1 0.5 -3" rotation="0 45 0" color="#e74c3c"></a-box>
        <a-sphere position="0 1.25 -5" radius="1.25" color="#2ecc71"></a-sphere>
        <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#f39c12"></a-cylinder>
        <!-- Adicione mais elementos 3D conforme desejado -->
        
        <!-- Componente de som para adicionar áudio -->
        <a-sound src="url_para_o_arquivo_de_audio.mp3" autoplay="true"></a-sound>
        
        <!-- Componente de interação para manipulação do cenário -->
        <a-entity cursor="rayOrigin: mouse"></a-entity>
        
        <!-- Adicione mais componentes conforme necessário -->
    </a-scene>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

    <!-- Bibliotecas usadas nesta página (clicar para abrir a lista) -->
    <details class="bibliotecas-usadas" style="position:fixed;bottom:10px;left:10px;z-index:9999;max-width:340px;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,0.7);color:#fff;font:12px/1.4 Arial,sans-serif">
      <summary style="cursor:pointer">&#8505;&#65039; Bibliotecas</summary>
      <ul style="margin:6px 0 0;padding-left:16px">
        <li><a href="https://aframe.io" target="_blank" rel="noopener" style="color:#87ceeb">A-Frame</a> 1.2.0</li>
      </ul>
    </details>
</body>
</html>
