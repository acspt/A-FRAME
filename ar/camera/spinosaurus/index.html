<!DOCTYPE html>
<html lang="pt">
  <head>
    <title>Spinosaurus em AR (câmara do dispositivo)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- AR.js: mostra a imagem da câmara (webcam ou câmara do telemóvel) por trás da cena -->
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>
  </head>
  <body>
    <!-- embedded + arjs="sourceType: webcam": a cena fica por cima da imagem da câmara, sem marcador.
         xr-mode-ui="enabled: false": sem botões de VR/AR, porque o AR aqui é feito pelo AR.js -->
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false"
      xr-mode-ui="enabled: false"
      renderer="alpha: true"
    >
      <a-assets timeout="30000">
        <!-- modelo do spinosaurus, na pasta assets deste exemplo -->
        <a-asset-item id="spinosaurus" src="assets/spinosaurus.glb"></a-asset-item>
      </a-assets>

      <!-- O dinossauro, à frente da câmara; no telemóvel, rodar o telemóvel para olhar à volta -->
      <a-entity id="dino" position="-1 0 -3" scale="0.5 0.5 0.5">
        <a-entity
          position="0 1.05 -2"
          rotation="0 45 0"
          gltf-model="#spinosaurus"
          scale="0.5 0.5 0.5"
        ></a-entity>
      </a-entity>

      <!-- Luzes -->
      <a-entity light="type: ambient; intensity: 0.8"></a-entity>
      <a-entity light="type: directional; intensity: 0.8" position="-5 3 1.5"></a-entity>
    </a-scene>

    <div id="text">
      <h1>A-Frame Spinosaurus em AR</h1>
      <p class="creditos">
        Permitir o acesso à câmara. O dinossauro aparece por cima da imagem da câmara.
        Modelo:
        <a href="https://sketchfab.com/3d-models/spinosaurus-2135501583704537907645bf723685e7" target="_blank">Spinosaurus</a>,
        de <a href="https://sketchfab.com/VapTor" target="_blank">Vaptor-Studio</a>.
      </p>
    </div>
  </body>
</html>
