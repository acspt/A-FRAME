<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>via lactea</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="
https://cdn.jsdelivr.net/npm/aframe-curve-component@0.1.3/dist/aframe-curve-component.min.js
"></script>
    <script src="a-frame-animation-camera-alongpath.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="info">
      <h1>Solar System</h1>
      <p>Explore the Solar System with A-Frame!</p>
    </div>
    <a-scene>
      <!-- imagem hdr fundão -->
      <a-sky
        src="assets/outer-space-background.jpg"
      ></a-sky>

      <!-- Sun with interactivity and light -->

      <!-- Sun with interactivity and light -->
      <a-sphere
        id="sun"
        position="0 1 -5"
        radius="1.5"
        color="yellow"
        emissive="yellow"
        emissive-intensity="0.9"
        event-set__mouseenter="color: blue"
        event-set__mouseleave="color: yellow"
      ></a-sphere>

      <!-- Mercurio -->
      <a-sphere position="2 1 -5" radius="0.05" color="gray"></a-sphere>

      <!-- Venus -->
      <a-sphere position="3 1 -5" radius="0.1" color="orange"></a-sphere>

      <!-- terra e lua  -->
      <a-entity position="4 1 -5">
        <a-sphere
          id="earth"
          radius="0.1"
          src="assets/earth_atmos_2048.jpg"
          animation="property: rotation; to: 0 360 0; dur: 10000; loop: true; easing: linear"
        ></a-sphere>
        <a-entity
          rotation="0 0 0"
          animation="property: rotation; to: 0 360 0; dur: 10000; loop: true; easing: linear"
        >
          <a-sphere
            id="moon"
            radius="0.03"
            color="white"
            position="0.2 0 0"
          ></a-sphere>
        </a-entity>
      </a-entity>

      <!-- Marte -->
      <a-sphere position="5 1 -5" radius="0.07" color="red"></a-sphere>

      <!-- Jupiter -->
      <a-sphere position="7 1 -5" radius="0.5" color="orange"></a-sphere>

      <!-- Saturno -->
      <a-sphere position="9 1 -5" radius="0.4" color="yellow"></a-sphere>
      <a-ring
        position="9 1 -5"
        radius-inner="0.5"
        radius-outer="0.7"
        color="brown"
      ></a-ring>

      <!-- Urano -->
      <a-sphere position="11 1 -5" radius="0.3" color="lightblue"></a-sphere>

      <!-- Neptuno -->
      <a-sphere position="13 1 -5" radius="0.3" color="blue"></a-sphere>

      <a-sphere position="13 1 -5" radius="0.3" color="blue"></a-sphere>

      <a-curve id="circlePath" curve="closed:true;type:CubicBezier">
        <a-curve-point position="1 1 30"></a-curve-point>
        <a-curve-point position="0 1 0"></a-curve-point>
        <a-curve-point position="-3 1 -8"></a-curve-point>
        <a-curve-point position="0.5 1 -8"></a-curve-point>
        <a-curve-point position="4.5 1 -3"></a-curve-point>
        <a-curve-point position="7 1 -10"></a-curve-point>
        <a-curve-point position="11 1 0"></a-curve-point>
        <a-curve-point position="3 1 -1"></a-curve-point>
        <a-curve-point position="5 1 -2"></a-curve-point>
      </a-curve>

      <a-entity
        aaclone-along-curve="curve: #circlePath; spacing: 0.02; rotation: 0 0 0;"
        aageometry="primitive:box; color:red; height:0.1; width:0.1; depth:0.1"
      ></a-entity>
      <a-entity
        id="cameraRig"
        movement-controls="fly: true; speed: 1"
        
        position="1 1 30"
        animation-alongpath="curve: #circlePath; dur:100000; loop:true; rotate:true;"
      >
        <a-camera
          wasd-controls
          look-controls="pointerLockEnabled: true"
          id="cam"
          position="0 0 0"
        >
          <a-entity
            gltf-model="url(assets/rocket.glb)"
            position="0 -2 -2"
            rotation="100 0 180"
            scale="0.3 0.3 0.3"
          ></a-entity>
        </a-camera>
      </a-entity>
      <!-- Draw the Curve -->

      <!-- Musica   -->
      <a-sound
        src="assets/y2mate.com---Interstellar-Main-Theme-Han.wav"
        autoplay="true"
        loop="true"
        position="0 1 -5"
      ></a-sound>

      <!-- texto via lactea -->
      <a-text value="VIA LACTEA" color="white" position="1 2 -3" scale="2 2 2" animation__a1="property: position; to: 4 4 -3; dur: 2000; dir: alternate; loop: true">
        
      </a-text>

      <!-- foguete -->
    </a-scene>
  </body>
</html>
