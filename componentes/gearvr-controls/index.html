<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <title>GearVR Controls: A-Frame Registry</title>
    <!--
      Componente "GearVR Controls" do A-Frame Registry (https://aframe.io/aframe-registry/)
      Suporte para o comando do Samsung GearVR.
      Só funciona no GearVR (Samsung + óculos). No computador vê-se a cena sem comando.
    -->
    <script src="https://aframe.io/releases/0.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-gearvr-controls-component@0.1.7/dist/aframe-gearvr-controls-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Modelo e botoes do comando GearVR -->
      <a-entity gearvr-controls></a-entity>

      <a-box position="0 1 -3" color="#C03546"></a-box>
      <a-plane rotation="-90 0 0" width="6" height="6" color="#7BC8A4"></a-plane>
      <a-sky color="#3CF"></a-sky>
    </a-scene>
  </body>
</html>
