<html>
  <head>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-aabb-collider-component@3.2.0/dist/aframe-aabb-collider-component.min.js"></script>
    <script src="script.js"></script>
  </head>
  <body>
    <a-scene>
      <a-camera id="camera"></a-camera>
      <a-entity
        class="physical-entity"
        physical-entity
        id="bullet"
        geometry="primitive: cone; radiusBottom:0.5; height:2;"
        color= "red"
        position="0 1 -5"
        aabb-collider="objects: .physical-entity"
      ></a-entity>
      <a-entity
        physical-entity
        class="physical-entity"
        id="plate_big"
        geometry="primitive: cylinder; height:0.2;"
        color="blue"
        position="0 0.8 -5"
        aabb-collider="objects: .physical-entity"
      ></a-entity>
      <a-entity
        physical-entity
        class="physical-entity"
        id="plate_small"
        geometry="primitive: cylinder; height:0.2; radius:0.6;"
        color="blue"
        position="0 1.4 -5"
        aabb-collider="objects: .physical-entity"
      ></a-entity>
    </a-scene>
  
    <!-- Bibliotecas usadas nesta página (clicar para abrir a lista) -->
    <details class="bibliotecas-usadas" style="position:fixed;bottom:10px;left:10px;z-index:9999;max-width:340px;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,0.7);color:#fff;font:12px/1.4 Arial,sans-serif">
      <summary style="cursor:pointer">&#8505;&#65039; Bibliotecas</summary>
      <ul style="margin:6px 0 0;padding-left:16px">
        <li><a href="https://aframe.io" target="_blank" rel="noopener" style="color:#87ceeb">A-Frame</a> 1.0.4</li>
        <li><a href="https://github.com/supermedium/superframe/tree/master/components/aabb-collider" target="_blank" rel="noopener" style="color:#87ceeb">aframe-aabb-collider-component</a> 3.2.0</li>
      </ul>
    </details>
</body>
</html>
