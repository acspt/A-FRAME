<!DOCTYPE html>
<html>

    <script src="script.js"></script>

  <body style="margin: 0; overflow: hidden">
    <a-scene id="container">
      <a-assets>
        <img
          id="acs"
          src="assets/perfil-acs.png"
        />
      </a-assets>
      <a-plane src="#acs" position="0 2 -100" height="2" width="2"></a-plane>
    </a-scene>
  
    <!-- Bibliotecas usadas nesta página (clicar para abrir a lista) -->

        <li><a href="https://aframe.io" target="_blank" rel="noopener" style="color:#87ceeb">A-Frame</a> 1.5.0</li>

</html>
