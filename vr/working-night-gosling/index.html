<!DOCTYPE html>
<html>
  <head>
    <title>Entity-Component - Registry</title>
    <meta name="description" content="Entity-Component - Registry">
    <script src="https://aframe.io/releases/0.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-animation-component@3.2.1/dist/aframe-animation-component.min.js"></script>
    <script src="https://unpkg.com/aframe-particle-system-component@1.0.x/dist/aframe-particle-system-component.min.js"></script>
    <script src="https://unpkg.com/aframe-extras.ocean@%5E3.5.x/dist/aframe-extras.ocean.min.js"></script>
    <script src="https://unpkg.com/aframe-gradient-sky@1.0.4/dist/gradientsky.min.js"></script>
    <script src="https://unpkg.com/aframe-extras.tube@%5E3.5.x/dist/aframe-extras.tube.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-entity id="rain" particle-system="preset: rain; color: #24CAFF; particleCount: 5000"></a-entity>

      <a-entity id="sphere" geometry="primitive: sphere"
                material="color: #EFEFEF; shader: flat"
                position="10 0.15 -5"
                light="type: point; intensity: 5"
                animation="property: position; easing: easeInOutQuad; dir: alternate; dur: 1000; to: 0 -0.10 -5; loop: true"></a-entity>

      <a-entity id="ocean" ocean="density: 20; width: 50; depth: 50; speed: 4"
                material="color: #9CE3F9; opacity: 0.75; metalness: 0; roughness: 1"
                rotation="-90 0 0"></a-entity>
      
      <a-entity id="sky" geometry="primitive: sphere; radius: 5000"
                material="shader: gradient; topColor: 235 235 245; bottomColor: 185 185 210"
                scale="-1 1 1"></a-entity>
      
      <a-entity id="light" light="type: ambient; color: #888"></a-entity>
    </a-scene>
  
    <!-- Bibliotecas usadas nesta página (clicar para abrir a lista) -->
    <details class="bibliotecas-usadas" style="position:fixed;bottom:10px;left:10px;z-index:9999;max-width:340px;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,0.7);color:#fff;font:12px/1.4 Arial,sans-serif">
      <summary style="cursor:pointer">&#8505;&#65039; Bibliotecas</summary>
      <ul style="margin:6px 0 0;padding-left:16px">
        <li><a href="https://aframe.io" target="_blank" rel="noopener" style="color:#87ceeb">A-Frame</a> 0.5.0</li>
        <li><a href="https://github.com/supermedium/superframe/tree/master/components/animation" target="_blank" rel="noopener" style="color:#87ceeb">aframe-animation-component (antigo)</a> 3.2.1</li>
        <li><a href="https://github.com/IdeaSpaceVR/aframe-particle-system-component" target="_blank" rel="noopener" style="color:#87ceeb">aframe-particle-system-component</a> 1.0.x</li>
        <li><a href="https://github.com/c-frame/aframe-extras" target="_blank" rel="noopener" style="color:#87ceeb">aframe-extras</a></li>
        <li><a href="https://github.com/zcanter/aframe-gradient-sky" target="_blank" rel="noopener" style="color:#87ceeb">aframe-gradient-sky</a> 1.0.4</li>
      </ul>
    </details>
</body>
</html>
