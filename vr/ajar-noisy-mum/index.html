<html>
  <head>
    <script src="https://unpkg.com/aframe-animation-component@^4.1.2/dist/aframe-animation-component.min.js"></script>
    <script src="https://aframe.io/releases/1.0.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-particle-system-component@1.0.x/dist/aframe-particle-system-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-camera>
        <a-cursor></a-cursor>
      </a-camera>
      <a-assets>
        <img
          id="boxTexture"
          src="assets/WhatsApp-Image-2023-11-17-at-22.34.06.jpg"
        />
        <audio
          id="musicbox"
          src="assets/Super_Mario_64_Soundtrack_-_File_Select.wav"
        ></audio>
      </a-assets>
      <a-entity
        position="0 2.25 -15"
        particle-system="preset: snow; particleCount: 3000; velocityValue: 0 -2 0; size: 1"
      ></a-entity>
      <a-box
        src="#boxTexture"
        position="0 1 -3"
        animation="property: rotation; to: 0 360 360; dur: 4000; loop: true"
        ><a-sound autoplay="true" loop="true" src="#musicbox"></a-sound
      ></a-box>
      <a-text
        position="0 1 -1"
        value="Obra de arte linda e maravilhosa"
        align="center"
        width="5"
      ></a-text>

      <a-link
        position="4 1.6 0"
        href="mundo.html"
        title="Vai para o outro mundo"
        rotation="0 90 0"
      ></a-link>

      <a-sky color="#00D1FF"></a-sky>
    </a-scene>
  
    <!-- Bibliotecas usadas nesta página (clicar para abrir a lista) -->
    <details class="bibliotecas-usadas" style="position:fixed;bottom:10px;left:10px;z-index:9999;max-width:340px;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,0.7);color:#fff;font:12px/1.4 Arial,sans-serif">
      <summary style="cursor:pointer">&#8505;&#65039; Bibliotecas</summary>
      <ul style="margin:6px 0 0;padding-left:16px">
        <li><a href="https://github.com/supermedium/superframe/tree/master/components/animation" target="_blank" rel="noopener" style="color:#87ceeb">aframe-animation-component (antigo)</a></li>
        <li><a href="https://aframe.io" target="_blank" rel="noopener" style="color:#87ceeb">A-Frame</a> 1.0.0</li>
        <li><a href="https://github.com/IdeaSpaceVR/aframe-particle-system-component" target="_blank" rel="noopener" style="color:#87ceeb">aframe-particle-system-component</a> 1.0.x</li>
      </ul>
    </details>
</body>
</html>
