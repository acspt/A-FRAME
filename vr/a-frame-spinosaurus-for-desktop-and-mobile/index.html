<!DOCTYPE html>
<html lang="en">
  <head>
    <title>XR Spinosaurus</title>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- import the webpage's stylesheet -->
    <link rel="stylesheet" href="style.css" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>

   </head>
  <body>
    <a-scene xr-mode-ui="enabled: false">
      <a-assets timeout="30000">
        <a-asset-item
          crossorigin="anonymous"
          id="spinosaurus"
          src="../../ar/image/detect-spinosaurus-arjs/assets/spinosaurus.glb"
        ></a-asset-item>
      </a-assets>


      <!-- Environment for 2D and VR viewing. It's auto-hidden in AR mode. -->
      <a-entity
        environment="preset: forest; lighting: none; shadow: none; lightPosition: 0 2.15 0"
      ></a-entity>

      <a-entity id="dino" position="-1 0 -3" scale="0.5 0.5 0.5">
        <a-entity
          position="0 2.186 0"
          rotation="0 55 0"
          gltf-model="#spinosaurus"
          animation-mixer
          shadow="cast: true; receive: false"
        ></a-entity>
      </a-entity>

      <a-entity light="type: ambient; intensity: 0.5;"></a-entity>
      <a-light
        type="directional"
        light="castShadow: true;
                      shadowMapHeight: 1024;
                      shadowMapWidth: 1024;
                      shadowCameraLeft: -7;
                      shadowCameraRight: 5;
                      shadowCameraBottom: -5;
                      shadowCameraTop: 5;"
        id="light"
        target="dino"
        position="-5 3 1.5"
      ></a-light>
    </a-scene>

    <div id="text">
      <h1>A-Frame Spinosaurus for DESKTOP/MOBILE</h1>
      <p>
        Size: <button id="btn_full">Full</button>
        <button id="btn_half">1/2</button>
        <button id="btn_quarter">1/4</button>
      </p>
    </div>
    <script>
      function setSize(scale) {
        document
          .getElementById("dino")
          .setAttribute("scale", { x: scale, y: scale, z: scale });
      }
      document.getElementById("btn_full").onclick = setSize.bind(this, 1);
      document.getElementById("btn_half").onclick = setSize.bind(this, 0.5);
      document.getElementById("btn_quarter").onclick = setSize.bind(this, 0.25);
    </script>
  
</body>
</html>
