<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <title>Auto Detect Controllers: A-Frame Registry</title>
    <!--
      Componente "Auto Detect Controllers" do A-Frame Registry (https://aframe.io/aframe-registry/)
      Deteta automaticamente o tipo de comando VR ligado (Vive, Oculus, Daydream, GearVR).
      Abre num óculos VR com comandos: os comandos aparecem nas mãos. No computador vê-se só a cena.
    -->
    <script src="https://aframe.io/releases/0.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-auto-detect-controllers-component@0.1.4/dist/aframe-auto-detect-controllers-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Uma entidade para cada mao: o componente escolhe o modelo do comando certo -->
      <a-entity auto-detect-controllers="hand: left"></a-entity>
      <a-entity auto-detect-controllers="hand: right"></a-entity>

      <a-box position="0 1 -3" color="#C03546"></a-box>
      <a-plane rotation="-90 0 0" width="6" height="6" color="#7BC8A4"></a-plane>
      <a-sky color="#3CF"></a-sky>
    </a-scene>
  </body>
</html>
