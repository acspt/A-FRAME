<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>A-Frame Collision Detection</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
     <script src="script.js">
r('#moving').setAttribute('collider-check', '');
    </script>
  
  </head>
  <body>
    <a-scene>
      <!-- Stationary Object -->
      <a-box id="stationary" position="0 1.5 -5" color="red" scale="10 10 1"></a-box>

      <!-- Moving Object -->
      <a-sphere id="moving" position="0 1.5 0" color="blue" radius="0.6" movement collider-chec></a-sphere>

      <!-- Camera -->
      <a-entity camera look-controls position="0 1.6 3"></a-entity>
    </a-scene>

    <script>

      document.querySelector('#moving').setAttribute('collider-check', '');
    </script>
  
</body>
</html>
