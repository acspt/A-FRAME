<html>
  <head>
    <!-- Origem: backup do Glitch, projeto "silver-magnetic-gambler-galeria-vr" (cópia de 2025-12-24 19:59) -->
    <meta charset="utf-8" />
    <title>Galeria Vr</title>
    <meta name="description" content="A-Frame VR Gallery" />
    <script src="https://aframe.io/releases/1.0.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-particle-system-component@1.0.x/dist/aframe-particle-system-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/aframe-curve-component@0.1.3/dist/aframe-curve-component.min.js"></script>
    <script src="a-frame-animation-camera-alongpath.js"></script>

  </head>
  <body>
    <a-scene background="color: black"
      >>
      <a-curve id="circlePath" curve="closed:true;type:CubicBezier">
        <a-curve-point position="5 1 -5"></a-curve-point>
        <a-curve-point position="3.5 0 -3.5"></a-curve-point>
        <a-curve-point position="0 0 0"></a-curve-point>
        <a-curve-point position="-3.5 0 -3.5"></a-curve-point>
        <a-curve-point position="-5 0 -5"></a-curve-point>
        <a-curve-point position="-3.5 0 -6.5"></a-curve-point>
        <a-curve-point position="0 0 -10"></a-curve-point>
        <a-curve-point position="3.5 0 -6.5"></a-curve-point>
      </a-curve>

      <a-entity
        clone-along-curve="curve: #circlePath; spacing: 0.02; rotation: 0 0 0;"
        geometry="primitive:box; color:red; height:0.1; width:0.1; depth:0.1"
      ></a-entity>
      <a-entity
        id="cameraRig"
        camera-log
        animation-alongpath="curve: #circlePath; dur:5000; loop:true; rotate:true; rotateOffset:0 90 0"
        movement-controls="fly: true; speed: 0.1"
      >
        <a-camera
          wasd-controls
          look-controls="pointerLockEnabled: true"
          zoom="6"
        >
        </a-camera>
      </a-entity>
      <a-plane width= "30" height= "50"
        position="0 0 -5"
        rotation="-90 0 0"
        color= "#FFF"
      ></a-plane>
      <a-assets>
        <audio
          id="musicbox"
          src="assets/JacksonMusica.wav"
        ></audio>
      </a-assets>
   <a-sound
        autoplay="true"
        loop="true"
        src="#musicbox"
        volume="0.5"
        distanceModel="linear"
        rolloffFactor="0"
      ></a-sound>
    </a-scene>
  </body>
</html>
