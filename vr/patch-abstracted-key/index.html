<!DOCTYPE html>
<html>
  <head>
    <title>Event Set for Interactions - A-Frame</title>
    <script src="https://aframe.io/releases/0.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@3.0.3/dist/aframe-event-set-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      

      
        <a-entity id="pivot" position="0 2 -4" rotation="0 0 0">
    <!-- Door entity offset from the pivot -->
    <a-box id="door" position="-0.5 0 0" geometry="primitive: box; height: 4; width: 1; depth: 0.1" material="color: brown;"></a-box>
  </a-entity>

      <a-camera>
        <a-cursor></a-cursor>
      </a-camera>


    </a-scene>
  
</body>
    <script src="script.js"></script>
</html>
