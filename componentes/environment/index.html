<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <title>Environment: A-Frame Registry</title>
    <!--
      Componente "Environment" do A-Frame Registry (https://aframe.io/aframe-registry/)
      Cria ambientes completos (céu, chão, árvores, luz) com uma só linha.
      Floresta pronta a usar. Muda o preset (forest, egypt, tron, japan, dream...) para outro ambiente.
    -->
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.5.0/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Experimenta outros presets: default, contact, egypt, checkerboard, goaland, yavapai,
           goldmine, threetowers, poison, arches, tron, japan, dream, volcano, starry, osiris, moon -->
      <a-entity environment="preset: forest; dressingAmount: 300"></a-entity>

      <a-box position="0 1 -3" color="#EF2D5E"></a-box>
    </a-scene>
  </body>
</html>
