<!DOCTYPE html>
<html>
  <head>
    <title>Gaze-Based Interactions in A-Frame</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.1/dist/aframe-look-at-component.min.js"></script>
    
  </head>
  <body>
 
    <a-scene continuous-rotation>
      <!-- Camera -->
      <a-entity id="camera" camera look-controls>
        <a-cursor color="red"  raycaster="objects: .clickable"></a-cursor ></a-cursor>
     
    
        </a-entity>

      <!-- Clickable Objects -->
      <a-box id="box"
        class="clickable"
        position="-1 0.5 -3"
        rotation="0 45 0"
        color="#4CC3D9"
        width="1"
        height="1"
        depth="1"
      ></a-box>
      <a-sphere id="sphere"
        class="clickable"
        position="0 1.25 -5"
        radius="1.25"
        color="#EF2D5E"
      ></a-sphere>
      <a-cylinder id="cylinder"
        class="clickable"
        position="1 0.75 -3"
        rotation="90 0 0"
        radius="0.5"
        height="1.5"
        color="#FFC65D"
      ></a-cylinder>

      <!-- Lighting -->
      <a-light type="ambient" color="#445451"></a-light>
      <a-light type="point" position="2 4 4" intensity="0.4"></a-light>

      <!-- Ground -->
      <a-plane 
        position="0 0 -4"
        rotation="-90 0 0"
        width="4"
        height="4"
        color="#7BC8A4"
      ></a-plane>
    </a-scene>
   
    <script src="script.js"></script>
   
  
    <!-- Bibliotecas usadas nesta página (clicar para abrir a lista) -->
    <details class="bibliotecas-usadas" style="position:fixed;bottom:10px;left:10px;z-index:9999;max-width:340px;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,0.7);color:#fff;font:12px/1.4 Arial,sans-serif">
      <summary style="cursor:pointer">&#8505;&#65039; Bibliotecas</summary>
      <ul style="margin:6px 0 0;padding-left:16px">
        <li><a href="https://aframe.io" target="_blank" rel="noopener" style="color:#87ceeb">A-Frame</a> 1.3.0</li>
        <li><a href="https://github.com/supermedium/superframe/tree/master/components/look-at" target="_blank" rel="noopener" style="color:#87ceeb">aframe-look-at-component</a> 0.8.1</li>
      </ul>
    </details>
</body>
</html>
