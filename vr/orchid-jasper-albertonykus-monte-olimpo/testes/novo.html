<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>A-Frame Click Sequence</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Define the initial object -->
      <a-box id="initialObject" position="0 1 -3" color="red" depth="1" height="1" width="1"></a-box>

      <!-- Define the objects to appear in sequence -->
      <a-sphere id="object1" position="0 1 -3" radius="1" color="green" visible="false"></a-sphere>
      <a-cylinder id="object2" position="0 1 -3" radius="0.5" height="1.5" color="blue" visible="false"></a-cylinder>
      <a-torus id="object3" position="0 1 -3" radius="1" tube="0.2" color="yellow" visible="false"></a-torus>

      <!-- Add a camera to view the scene -->
      <a-entity camera look-controls position="0 0 0">
        <a-cursor></a-cursor>
      </a-entity>
      
      <!-- Script to handle the sequence -->
      <script>
        AFRAME.registerComponent('sequence-handler', {
          init: function () {
            let currentIndex = 0;
            const objects = [
              document.querySelector('#object1'),
              document.querySelector('#object2'),
              document.querySelector('#object3')
            ];

            this.el.addEventListener('click', function () {
              // Hide the current object
              if (currentIndex > 0) {
                objects[currentIndex - 1].setAttribute('visible', 'false');
              } else {
                this.setAttribute('visible', 'false'); // Hide initial object on first click
              }

              // Show the next object in the sequence
              if (currentIndex < objects.length) {
                objects[currentIndex].setAttribute('visible', 'true');
                currentIndex++;
              } else {
                // Reset to initial state after the last object
                currentIndex = 0;
                this.setAttribute('visible', 'true'); // Show initial object again
              }
            });
          }
        });

        // Attach the component to the initial object
        document.querySelector('#initialObject').setAttribute('sequence-handler', '');
      </script>
    </a-scene>
  
    <!-- Bibliotecas usadas nesta página (clicar para abrir a lista) -->
    <details class="bibliotecas-usadas" style="position:fixed;bottom:10px;left:10px;z-index:9999;max-width:340px;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,0.7);color:#fff;font:12px/1.4 Arial,sans-serif">
      <summary style="cursor:pointer">&#8505;&#65039; Bibliotecas</summary>
      <ul style="margin:6px 0 0;padding-left:16px">
        <li><a href="https://aframe.io" target="_blank" rel="noopener" style="color:#87ceeb">A-Frame</a> 1.2.0</li>
      </ul>
    </details>
</body>
</html>
