<html lang="en">
  <head>
    <!-- Origem: backup do Glitch, projeto "a-frame-man-walking" (cópia de 2025-12-24 19:52) -->
    <title>XR Spinosaurus</title>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- import the webpage's stylesheet -->
    <link rel="stylesheet" href="style.css" />

    <!-- import the webpage's javascript files -->
    <script src="https://aframe.io/releases/1.0.3/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/MozillaReality/ammo.js@8bbc0ea/builds/ammo.wasm.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.js"></script>
    <script src="//cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

    <script src="https://unpkg.com/aframe-environment-component@1.1.0/dist/aframe-environment-component.min.js"></script>

    <script src="script.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <!-- Model source: https://sketchfab.com/3d-models/spinosaurus-2135501583704537907645bf723685e7
             Model author: https://sketchfab.com/VapTor
             Model license: CC Attribution -->
        <a-asset-item
          crossorigin="anonymous"
          id="asset-man"
          src="assets/CesiumMan.glb"
          response-type="arraybuffer"
          cross
        ></a-asset-item>
      </a-assets>

      <a-camera position="0 1.2 0"></a-camera>

      <!-- Environment for 2D and VR viewing. It's auto-hidden in AR mode. -->
      <a-entity
        environment="preset: forest; lighting: none; shadow: none; lightPosition: 0 2.15 0"
        hide-in-ar-mode
      ></a-entity>

      <a-entity
        walking
        position="2 0 -1"
        rotation="0 90 0"
        gltf-model="#asset-man"
        animation-mixer
        shadow="cast: true; receive: false"
      >
      </a-entity>
 <a-entity
        walking
        position="-2 0 -1"
        rotation="0 90 0"
        gltf-model="#asset-man"
        animation-mixer
        shadow="cast: true; receive: false"
      >
      </a-entity>

      <a-entity
        walking
        position="0 0 -1"
        rotation="0 0 0"
        gltf-model="#asset-man"
        animation-mixer
        shadow="cast: true; receive: false"
      >
      </a-entity>

      <a-entity light="type: ambient; intensity: 0.5;"></a-entity>
      <a-light
        type="directional"
        light="castShadow: true;
                      shadowMapHeight: 1024;
                      shadowMapWidth: 1024;
                      shadowCameraLeft: -7;
                      shadowCameraRight: 5;
                      shadowCameraBottom: -5;
                      shadowCameraTop: 5;"
        id="light"
        target="dino"
        position="-5 3 1.5"
      ></a-light>

      <!-- This shadow-receiving plane is only visible in AR mode. -->
      <a-plane
        height="15"
        width="15"
        position="0 0 -3"
        rotation="-90 0 0"
        shadow="receive: true"
        ar-shadows="opacity: 0.3"
        visible="false"
      ></a-plane>
    </a-scene>
  </body>
</html>
