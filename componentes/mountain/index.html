<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <title>Mountain: A-Frame Registry</title>
    <!--
      Componente "Mountain" do A-Frame Registry (https://aframe.io/aframe-registry/)
      Montanha gerada aleatoriamente a partir de um mapa de alturas.
      Uma montanha diferente cada vez que se abre a página.
    -->
    <script src="https://aframe.io/releases/0.3.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-mountain-component@0.3.3/dist/aframe-mountain-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-mountain color="#C9A066" shadow-color="#5F818A"></a-mountain>
      <a-sky color="#5F818A"></a-sky>
    </a-scene>
  </body>
</html>
