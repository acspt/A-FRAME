<html>
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,shrink-to-fit=no,user-scalable=no,maximum-scale=1"
    />
    <title>Examples • Island</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.4.0/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Camera -->
      <a-entity id="rig" movement-controls position="3 30.4 -10">
        <a-entity
          id="camera"
          camera
          position="0 1.6 0"
          look-controls="pointerLockEnabled: true"
        ></a-entity>
      </a-entity>

      <!-- Island - Made in MagicaVoxel. -->
      <a-entity
        rotation="-90 0 0"
        scale="0.3 0.3 0.3"
        ply-model="src: url(assets/island-hut.bake.ply);"
      ></a-entity>

      <!-- Ocean -->
      <a-ocean
        width="50"
        depth="50"
        density="40"
        opacity="1"
        position="0 3 0"
      ></a-ocean>

      <!-- Sky -->
      <a-sky color="#AADDF0"></a-sky>

      <!-- Lighting -->
      <a-light type="ambient" color="#ccc"></a-light>
      <a-light
        color="#ddf"
        distance="100"
        intensity="0.4"
        type="point"
      ></a-light>
      <a-light
        color="#ddf"
        position="3 10 -10"
        distance="50"
        intensity="0.4"
        type="point"
      ></a-light>
    </a-scene>
  
    <!-- Bibliotecas usadas nesta página (clicar para abrir a lista) -->
    <details class="bibliotecas-usadas" style="position:fixed;bottom:10px;left:10px;z-index:9999;max-width:340px;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,0.7);color:#fff;font:12px/1.4 Arial,sans-serif">
      <summary style="cursor:pointer">&#8505;&#65039; Bibliotecas</summary>
      <ul style="margin:6px 0 0;padding-left:16px">
        <li><a href="https://aframe.io" target="_blank" rel="noopener" style="color:#87ceeb">A-Frame</a> 1.5.0</li>
        <li><a href="https://github.com/c-frame/aframe-extras" target="_blank" rel="noopener" style="color:#87ceeb">aframe-extras</a> 7.4.0</li>
      </ul>
    </details>
</body>
</html>
