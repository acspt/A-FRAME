<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Interactive 3D Plane in A-Frame</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Define the plane with an id for easy reference -->
      <a-plane id="interactive-plane" color="#4CC3D9" rotation="0 0 0" position="0 1 -2" width="4" height="2"></a-plane>

      <!-- Camera with cursor for interaction -->
      <a-camera>
        <a-cursor></a-cursor>
      </a-camera>
    </a-scene>

    <script>
      // Select the plane element
      var plane = document.querySelector('#interactive-plane');

      // Variable to keep track of the rotation state
      var isRotating = false;

      // Function to start or stop rotation
      function toggleRotation() {
        isRotating = !isRotating;
      }

      // Event listener for touch events on the plane
      plane.addEventListener('click', function () {
        toggleRotation();
      });

      // Update function to rotate the plane if isRotating is true
      function update() {
        if (isRotating) {
          var currentRotation = plane.getAttribute('rotation');
          plane.setAttribute('rotation', {
            x: currentRotation.x,
            y: currentRotation.y + 1, // Increment the y rotation
            z: currentRotation.z
          });
        }
        requestAnimationFrame(update);
      }

      // Start the update loop
      update();
    </script>
  
    <!-- Bibliotecas usadas nesta página (clicar para abrir a lista) -->
    <details class="bibliotecas-usadas" style="position:fixed;bottom:10px;left:10px;z-index:9999;max-width:340px;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,0.7);color:#fff;font:12px/1.4 Arial,sans-serif">
      <summary style="cursor:pointer">&#8505;&#65039; Bibliotecas</summary>
      <ul style="margin:6px 0 0;padding-left:16px">
        <li><a href="https://aframe.io" target="_blank" rel="noopener" style="color:#87ceeb">A-Frame</a> 1.5.0</li>
      </ul>
    </details>
</body>
</html>
