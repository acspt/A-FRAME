<head>
  <title>My A-Frame Scene</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<script src="https://unpkg.com/aframe-curves@1.0.0/build/curve.min.js"></script>


    <script src="https://cdn.jsdelivr.net/npm/aframe-alongpath-component@1.0.5/dist/aframe-alongpath-component.min.js"></script>

</head>
 
<body>
  <a-scene>
    <a-curve id="track1">
      <a-curve-point position="-2 2 -3"></a-curve-point>
      <a-curve-point position="0 1 -3"></a-curve-point>
      <a-curve-point position="2 2 -3"></a-curve-point>
    </a-curve>
    
    <a-box alongpath="curve: #track1"></a-box>
  </a-scene>
</body>
