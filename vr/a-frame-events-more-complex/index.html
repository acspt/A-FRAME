<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Interactive 3D Plane in A-Frame</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Define the plane with an id for easy reference -->
      <a-plane id="interactive-plane" color="#4CC3D9" rotation="0 0 0" position="0 1 -2" width="4" height="2"></a-plane>

      <!-- Camera with cursor for interaction -->
      <a-camera>
        <a-cursor></a-cursor>
      </a-camera>
    </a-scene>

    <!-- scripts do projeto, carregados no fim da página -->
    <script src="scripts.js"></script>
  </body>
</html>
