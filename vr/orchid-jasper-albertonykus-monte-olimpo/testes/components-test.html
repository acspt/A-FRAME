<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>A-Frame Click Counter</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent('click-counter', {
        init: function () {
          this.count = 0;  // Initialize count
          this.el.addEventListener('click', () => {
            this.count++;  // Increment the count
            console.log(`Entity clicked ${this.count} times`);
            // Optionally, update a text element with the count
            const textEl = document.querySelector('#click-count-text');
            if (textEl) {
              textEl.setAttribute('value', `Clicked: ${this.count} times`);
            }
          });
        }
      });
    </script>
  </head>
  <body>
    <a-scene>
      <!-- Define an entity and attach the click-counter component -->
      <a-box position="0 1.6 -3" rotation="0 45 0" color="#4CC3D9" click-counter></a-box>

      <!-- Optional text element to display the click count -->
      <a-text id="click-count-text" value="Clicked: 0 times" position="0 2.5 -3" color="#111"></a-text>

      <!-- Add a camera so you can look around -->
      <a-entity camera look-controls position="0 1.6 0"></a-entity>
    </a-scene>
  
</body>
</html>
