<html>
  <head>
    <script src="https://aframe.io/releases/1.0.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-animation-component@^4.1.2/dist/aframe-animation-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-camera>
        <a-cursor></a-cursor>
      </a-camera>
      <a-box
        id="redbox"
        position="6 1.6 -5"
        color="red"
        event-set__mouseenter="_target:#greenbox; width: 2"
        event-set__mouseleave="_target:#greenbox; width: 1"
      ></a-box>

      <a-box
        id="greenbox"
        position="6 2.6 -5"
        color="green"
        event-set__mouseenter="_target:#bluebox; width: 2"
        event-set__mouseleave="_target:#bluebox; width: 1"
      ></a-box>
      <a-assets>
        <img
          id="customTexture"
          src="assets/untitled.png"
        />
      </a-assets>

      <a-text
        position="0 1 -1"
        value="Wow foste para outra parte"
        align="center"
        width="5"
      ></a-text>
      <a-asset-item
        id="Finn-obj"
        src="https://raw.githubusercontent.com/AntaniiCUNHA/galeriaaa/main/untitled.obj"
      ></a-asset-item>
      <a-asset-item
        id="finn-mtl"
        src="https://raw.githubusercontent.com/AntaniiCUNHA/galeriaaa/main/untitled.mtl"
      ></a-asset-item>
      <a-obj-model
        src="#Finn-obj"
        mtl="#finn-mtl"
        material="src: #customTexture"
        rotation="0 0 0"
        position="0 0 -2"
        color="#FFFFF"
      ></a-obj-model>
      <a-sky color="#2FF495"></a-sky>

      <a-link
        position="3 1.6 -5"
        href="index.html"
        title="Volta para o outro mundo"
      ></a-link>
    </a-scene>
  
    <!-- Bibliotecas usadas nesta página (clicar para abrir a lista) -->
    <details class="bibliotecas-usadas" style="position:fixed;bottom:10px;left:10px;z-index:9999;max-width:340px;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,0.7);color:#fff;font:12px/1.4 Arial,sans-serif">
      <summary style="cursor:pointer">&#8505;&#65039; Bibliotecas</summary>
      <ul style="margin:6px 0 0;padding-left:16px">
        <li><a href="https://aframe.io" target="_blank" rel="noopener" style="color:#87ceeb">A-Frame</a> 1.0.0</li>
        <li><a href="https://github.com/supermedium/superframe/tree/master/components/animation" target="_blank" rel="noopener" style="color:#87ceeb">aframe-animation-component (antigo)</a></li>
      </ul>
    </details>
</body>
</html>
