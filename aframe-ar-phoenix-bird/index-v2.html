<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phoenix AR - v2 (Image Tracking)</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- MindAR: image tracking (a phoenix só aparece quando a imagem é detetada) -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <!-- necessário para animar ficheiros glTF -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  </head>

  <body>

    <!-- targets.mind é gerado a partir de assets/anchor.png -->
    <a-scene
      mindar-image="imageTargetSrc: assets/targets.mind; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <a-asset-item id="phoenix" src="assets/phoenix_bird.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-light type="ambient" intensity="1"></a-light>
      <a-light type="directional" position="0 1 1" intensity="1"></a-light>

      <!-- Tudo o que está dentro deste entity só é visível enquanto a imagem 0 é detetada -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model src="#phoenix"
                      animation-mixer="clip: Take 001"
                      position="0.35 0 0.2"
                      rotation="90 0 0"
                      scale="0.001 0.001 0.001"></a-gltf-model>
      </a-entity>
    </a-scene>

  </body>
</html>
