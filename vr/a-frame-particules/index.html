<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>A-Frame Particle System Component Example</title>
    <meta name="description" content="Hello, World!" />
    <script src="https://aframe.io/releases/0.7.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-particle-system-component@1.0.x/dist/aframe-particle-system-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Particle system uses 'default' preset, setting custom colors. -->
      <a-entity
        position="0 0 -5"
        particle-system="color: #EF0000,#44CC00"
      ></a-entity>

      <a-cylinder
        position="0 -0.7 -5"
        radius="0.5"
        height="1.5"
        color="#FFC65D"
      >
      </a-cylinder>

      <a-sky color="#000000"></a-sky>

      <a-camera>
        <a-cursor></a-cursor>
      </a-camera>
    </a-scene>
  
    <!-- Bibliotecas usadas nesta página (clicar para abrir a lista) -->
    <details class="bibliotecas-usadas" style="position:fixed;bottom:10px;left:10px;z-index:9999;max-width:340px;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,0.7);color:#fff;font:12px/1.4 Arial,sans-serif">
      <summary style="cursor:pointer">&#8505;&#65039; Bibliotecas</summary>
      <ul style="margin:6px 0 0;padding-left:16px">
        <li><a href="https://aframe.io" target="_blank" rel="noopener" style="color:#87ceeb">A-Frame</a> 0.7.0</li>
        <li><a href="https://github.com/IdeaSpaceVR/aframe-particle-system-component" target="_blank" rel="noopener" style="color:#87ceeb">aframe-particle-system-component</a> 1.0.x</li>
      </ul>
    </details>
</body>
</html>
