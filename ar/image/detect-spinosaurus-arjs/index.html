<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="description" content="Realidade aumentada: aponte a câmara para a imagem do spinosaurus para ver o modelo 3D." />
    <title>Spinosaurus NFT</title>
    <!-- A-Frame e AR.js (versão com image tracking / NFT) em versões fixas -->
    <!-- A-Frame 1.6.0: é a versão para a qual o AR.js 3.4.8 (o mais recente) foi feito -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar-nft.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      /* ecrã de carregamento: o AR.js remove sozinho o elemento .arjs-loader quando os descritores acabam de carregar */
      .arjs-loader {
        position: absolute;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1rem;
        padding: 1.5rem;
        background-color: rgba(0, 0, 0, 0.85);
        color: #fff;
        text-align: center;
        font-size: 1.25rem;
        line-height: 1.5;
      }
      .arjs-loader p {
        margin: 0;
        max-width: 28rem;
      }
      /* dica permanente, discreta, que não bloqueia toques na cena */
      .dica {
        position: absolute;
        left: 1rem;
        right: 1rem;
        bottom: 1rem;
        z-index: 10;
        margin: 0 auto;
        max-width: 28rem;
        padding: 0.75rem 1rem;
        border-radius: 0.5rem;
        background-color: rgba(0, 0, 0, 0.7);
        color: #fff;
        text-align: center;
        font-size: 1rem;
        line-height: 1.4;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: no-preference) {
        .arjs-loader strong {
          animation: pulsar 1.5s ease-in-out infinite;
        }
      }
      @keyframes pulsar {
        50% { opacity: 0.4; }
      }
    </style>
  </head>
  <body>
    <!-- mensagem visível enquanto a câmara e os descritores NFT carregam (pode demorar alguns segundos) -->
    <div class="arjs-loader" role="status" aria-live="polite">
      <strong>A carregar a realidade aumentada…</strong>
      <p>Permita o acesso à câmara quando o navegador pedir.</p>
    </div>
    <p class="dica" role="note">
      Aponte a câmara para a imagem do spinosaurus, com boa luz, a cerca de 30 a 50 cm, e mantenha o telemóvel estável.
    </p>
    <!-- sourceWidth/Height e displayWidth/Height: pedir 1280 x 960 à câmara (o padrão é 640 x 480) dá mais detalhe à imagem e facilita a deteção NFT -->
    <!-- device-orientation-permission-ui desligado: evita um pedido de permissão desnecessário no iOS -->
    <a-scene
      vr-mode-ui="enabled: false;"
      device-orientation-permission-ui="enabled: false;"
      renderer="logarithmicDepthBuffer: true; precision: medium;"
      embedded
      arjs="trackingMethod: best; sourceType: webcam; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960; debugUIEnabled: false;">
      <!-- a-nft é a âncora da imagem detetada; o url termina no nome dos descritores, sem extensão -->
      <!-- o url tem de ser absoluto: o AR.js carrega os descritores a partir da raiz do site -->
      <!-- smooth*: suaviza a pose para o modelo não tremer quando a deteção oscila -->
      <a-nft
        type="nft"
        url="https://acspt.github.io/A-FRAME/ar/image/detect-spinosaurus-arjs/assets/nft/target"
        smooth="true"
        smoothCount="10"
        smoothTolerance=".01"
        smoothThreshold="5">
        <!-- conteúdo mostrado sobre a imagem: o modelo glTF do spinosaurus -->
        <!-- no NFT as unidades são milímetros da imagem (1600 x 1019 px a 72 dpi = 564 x 359); o modelo mede ~8, por isso escala 40 -->
        <a-entity
          gltf-model="url(assets/spinosaurus.glb)"
          scale="40 40 40"
          position="0 0 0">
        </a-entity>
      </a-nft>
      <!-- câmara estática; o AR.js move o conteúdo de acordo com a imagem detetada -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
