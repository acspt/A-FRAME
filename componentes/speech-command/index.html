<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <title>Speech Command: A-Frame Registry</title>
    <!--
      Componente "Speech Command" do A-Frame Registry (https://aframe.io/aframe-registry/)
      Comandos de voz (Chrome) para mudar atributos de entidades.
      Diz "vermelho", "azul" ou "esconder"/"mostrar" (em inglês funciona melhor). Sem microfone, usa as teclas R, B, H e S.
    -->
    <script src="https://aframe.io/releases/0.4.0/aframe.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/annyang/2.6.1/annyang.min.js"></script>
    <script src="https://unpkg.com/aframe-speech-command-component@0.4.2/dist/aframe-speech-command-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Liga o reconhecimento de voz (biblioteca annyang) -->
      <a-entity annyang-speech-recognition></a-entity>

      <!-- Cada speech-command: palavra a dizer, atributo a mudar e valor; keyCode e uma tecla de atalho -->
      <a-box id="caixa" position="0 1 -3" color="#4CC3D9"
             speech-command__vermelho="command: vermelho; type: attribute; attribute: color; value: red; keyCode: 82"
             speech-command__azul="command: azul; type: attribute; attribute: color; value: blue; keyCode: 66"
             speech-command__esconder="command: esconder; type: attribute; attribute: visible; value: false; keyCode: 72"
             speech-command__mostrar="command: mostrar; type: attribute; attribute: visible; value: true; keyCode: 83"></a-box>

      <a-plane rotation="-90 0 0" width="6" height="6" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
