<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Phoenix NFT</title>
    <!-- A-Frame e AR.js (versão com image tracking / NFT) em versões fixas -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar-nft.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <!-- o AR.js trata o vídeo como 4:3 deitado; com o telemóvel na vertical a imagem é muito cortada (parece zoom) -->
    <a-scene
      vr-mode-ui="enabled: false;"
      renderer="logarithmicDepthBuffer: true;"
      embedded
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
      <!-- a-nft é a âncora da imagem detetada; o url termina no nome dos descritores, sem extensão -->
      <a-nft
        type="nft"
        url="https://acspt.github.io/A-FRAME/ar/image/detect-phoenix-bird-arjs/assets/nft/target"
        smooth="true"
        smoothCount="10"
        smoothTolerance=".01"
        smoothThreshold="5">
        <!-- conteúdo mostrado sobre a imagem: o modelo glTF da phoenix -->
       
         <a-gltf-model src="url(assets/phoenix_bird.glb)"
                  animation-mixer="clip: Take 001"
                  position="0 0 -2"
                  scale="1 1 1"
                  ></a-gltf-model>
      </a-nft>
      <!-- câmara estática; o AR.js move o conteúdo de acordo com a imagem detetada -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
