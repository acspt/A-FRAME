<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <title>Physics System: A-Frame Registry</title>
    <!--
      Componente "Physics System" do A-Frame Registry (https://aframe.io/aframe-registry/)
      Física (gravidade e colisões) com o motor Cannon.js.
      As caixas e a esfera caem com a gravidade e chocam com o chão.
    -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-physics-system@4.0.2/dist/aframe-physics-system.min.js"></script>
  </head>
  <body>
    <a-scene physics="gravity: -9.8">
      <!-- dynamic-body: cai e choca; static-body: fica parado (chao) -->
      <a-box position="-1 4 -4" rotation="20 45 0" color="#4CC3D9" dynamic-body></a-box>
      <a-box position="0.5 6 -4" rotation="0 20 40" color="#FFC65D" dynamic-body></a-box>
      <a-sphere position="0 8 -4.5" radius="0.5" color="#EF2D5E" dynamic-body></a-sphere>

      <a-box position="0 0 -4" width="6" height="0.2" depth="6" color="#7BC8A4" static-body></a-box>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
