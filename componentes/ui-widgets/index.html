<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <title>UI Widgets: A-Frame Registry</title>
    <!--
      Componente "UI Widgets" do A-Frame Registry (https://aframe.io/aframe-registry/)
      Botões, interruptores, botões rotativos e sliders para usar com os comandos VR.
      Os widgets ficam sobre uma mesa. Em VR, toca-lhes com as mãos (hand-controls) para os usar.
    -->
    <script src="https://unpkg.com/aframe-ui-widgets@1.0.2/dist/aframe-ui-widgets.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-entity hand-controls="left"></a-entity>
      <a-entity hand-controls="right"></a-entity>

      <!-- Mesa com os widgets: botao, botao rotativo, interruptor e slider -->
      <a-entity position="0 1.1 -0.8" rotation="45 0 0">
        <a-entity ui-button position="-0.45 0 0"></a-entity>
        <a-entity ui-rotary position="-0.15 0 0"></a-entity>
        <a-entity ui-toggle="value: 0" position="0.15 0 0"></a-entity>
        <a-entity ui-slider="min: 1; max: 10; value: 5" position="0.45 0 0" rotation="0 90 0"></a-entity>
      </a-entity>

      <a-sky color="#333"></a-sky>
    </a-scene>
  </body>
</html>
