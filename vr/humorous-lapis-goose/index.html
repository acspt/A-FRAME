<html>
  <head>
    <script>
      // WebXR requires https: to work so ensure redirected if needed.
      if (
        location.hostname !== "localhost" &&
        window.location.protocol === "http:"
      )
        window.location.protocol = "https:";
    </script>

    <!-- the AFrame library and 3rd party components -->
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-environment-component@1.3.4/dist/aframe-environment-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/components/sphere-collider.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.controls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/physx@v0.1.0/dist/physx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls@0.4.3/dist/aframe-blink-controls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/handy-work@3.1.10/build/handy-controls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/handy-work@3.1.10/build/magnet-helpers.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-htmlmesh@2.2.0/build/aframe-html.min.js"></script>
    <script src="ar-shadow-helper.js"></script>
    <script src="ar-cursor.js"></script>
    <script src="simple-navmesh-constraint.js"></script>
    <script src="model-utils.js"></script>

    <!-- Our custom behaviour -->
    <script src="main.js"></script>

    <title>AFrame Handy Demo</title>
  </head>

  <body>
    <a-scene
      physx="autoLoad: true; delay: 1000; wasmUrl: https://cdn.jsdelivr.net/gh/c-frame/physx@v0.1.0/wasm/physx.release.wasm; useDefaultScene: false;"
      webxr="overlayElement:#dom-overlay;"
      background="color:skyblue;"
      reflection="directionalLight:#dirlight;"
      renderer="alpha:true;physicallyCorrectLights:true;colorManagement:true;exposure:2;toneMapping:ACESFilmic;"
      ar-hit-test="target:#my-ar-objects;type:footprint;footprintDepth:0.2;"
      shadow="type: pcfsoft"
      gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.6/;"
      ar-cursor
      raycaster="objects: #my-ar-objects a-sphere"
      xr-mode-ui="XRMode:xr"
    >
      <a-assets>
        
        <a-asset-item
          id="navmesh-glb"
          src="assets/navmesh.glb"
        ></a-asset-item>
        <a-asset-item
          id="right-gltf"
          src="https://vazxmixjsiawhamofees.supabase.co/storage/v1/object/public/models/skeleton-right-hand-webxr/model.gltf"
        ></a-asset-item>
        <a-asset-item
          id="left-gltf"
          src="https://vazxmixjsiawhamofees.supabase.co/storage/v1/object/public/models/skeleton-left-hand-webxr/model.gltf"
        ></a-asset-item>
        <a-asset-item
          id="watch-gltf"
          src="assets/watch.glb"
        ></a-asset-item>
        <a-asset-item
          id="sword-gltf"
          src="assets/katana.glb"
        ></a-asset-item>
        <a-asset-item
          id="watergun-gltf"
          src="assets/watergun.glb"
        ></a-asset-item>
        <a-asset-item
          id="stew-gltf"
          src="assets/model.gltf"
        ></a-asset-item>
        <a-asset-item
          id="table-gltf"
          src="assets/small_wooden_table_01_1k-v1.glb"
        ></a-asset-item>
        <a-asset-item
          id="clock-gltf"
          src="assets/vintage_grandfather_clock_01_1k-v2.glb"
        ></a-asset-item>
        <a-mixin
          id="animations"
          animation__click="property: components.material.material.color; type: color; to: blue; startEvents: click; dur: 500;"
        ></a-mixin>
        <a-mixin
          id="blink"
          blink-controls="rotateOnTeleport:false;cameraRig: #cameraRig; teleportOrigin: #head; collisionEntities:.navmesh;"
        ></a-mixin>
        <a-mixin
          id="handle-visual"
          geometry="width:0.05;height:0.05;depth:0.2"
        ></a-mixin>
      </a-assets>

      <a-entity
        id="cameraRig"
        simple-navmesh-constraint="navmesh:.navmesh;fall:0.5;height:0;exclude:.navmesh-hole;"
        movement-controls="speed:0.15;camera:#head;"
        position="-1 0 1"
        rotation="0 45 0"
        origin-on-ar-start
      >
        <!-- camera -->
        <a-entity
          id="head"
          camera="near:0.01;"
          look-controls="pointerLockEnabled: false"
          position="0 1.65 0"
        ></a-entity>
      </a-entity>

      
      
      
      <a-entity rotation="0 -50 0" position="0 0 0" hide-on-enter-ar>
    
        
        <a-gltf-model
          id="table"
          shadow="receive:true;"
          src="#table-gltf"
          position="-2 0 0.8"
          rotation="0 51 0"
          scale="1.5 1.5 1.5"
          physx-body-from-model="type: static;"
        
                      >
          <a-plane
            rotation="-90 0 0"
            width="1.2"
            height="0.6"
            class="navmesh-hole"
            visible="true"
            color="red"
          ></a-plane>
        </a-gltf-model>

        <!-- Button test -->
        
      
 <a-plane
            rotation="-90 0 0"
            width="120"
            height="600"
            class="navmesh"
            visible="true"
            color="red"
          ></a-plane>
        
    
       
      </a-entity>

      <a-sphere
        color="black"
        radius="0.005"
        id="cursor"
        material="shader:flat"
        visible="false"
      ></a-sphere>
    </a-scene>
  
    <!-- Bibliotecas usadas nesta página (clicar para abrir a lista) -->
    <details class="bibliotecas-usadas" style="position:fixed;bottom:10px;left:10px;z-index:9999;max-width:340px;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,0.7);color:#fff;font:12px/1.4 Arial,sans-serif">
      <summary style="cursor:pointer">&#8505;&#65039; Bibliotecas</summary>
      <ul style="margin:6px 0 0;padding-left:16px">
        <li><a href="https://aframe.io" target="_blank" rel="noopener" style="color:#87ceeb">A-Frame</a> 1.5.0</li>
        <li><a href="https://github.com/supermedium/aframe-environment-component" target="_blank" rel="noopener" style="color:#87ceeb">aframe-environment-component</a> 1.3.4</li>
        <li><a href="https://github.com/c-frame/aframe-extras" target="_blank" rel="noopener" style="color:#87ceeb">aframe-extras</a> 7.2.0</li>
        <li><a href="https://github.com/c-frame/physx" target="_blank" rel="noopener" style="color:#87ceeb">PhysX para A-Frame</a> 0.1.0</li>
        <li><a href="https://github.com/jure/aframe-blink-controls" target="_blank" rel="noopener" style="color:#87ceeb">aframe-blink-controls</a> 0.4.3</li>
        <li><a href="https://github.com/AdaRoseCannon/handy-work" target="_blank" rel="noopener" style="color:#87ceeb">handy-work</a> 3.1.10</li>
        <li><a href="https://github.com/AdaRoseCannon/aframe-htmlmesh" target="_blank" rel="noopener" style="color:#87ceeb">aframe-htmlmesh</a> 2.2.0</li>
      </ul>
    </details>
</body>
</html>
