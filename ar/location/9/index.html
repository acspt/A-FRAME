<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Física PhysX: estático e dinâmico</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/physx@latest/dist/physx.min.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden">
    <a-scene
      physx="autoLoad: true"
      physics="debug: true"
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
    >
      <a-camera
        gps-camera="simulateLatitude: 51.049; simulateLongitude: -0.723"
        
      ></a-camera>

      <a-plane
        physx-body="type: static"
        color="green"
        position="0 0 -5"
        height="5"
        width="10"
        rotation="-90 0 0"
      ></a-plane>
      <a-box
        position="5 1 -5"
        physx-body="type: static"
        color="red"
        depth="5"
        height="2"
        width="0.5"
      ></a-box>
      <a-sphere
        physx-body="type: dynamic"
        position="0.4 2 -3"
        color="blue"
      ></a-sphere>
      <a-box
        physx-body="type: dynamic"
        position="0 5 -3"
        color="#CCC"
        depth="2"
        height="4"
        width="0.5"
      ></a-box>
    </a-scene>
  </body>
</html>
