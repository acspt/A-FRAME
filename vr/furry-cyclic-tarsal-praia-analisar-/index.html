<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Obra de arte em A-Frame</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/donmccurdy/aframe-extras/v6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.rawgit.com/fernandojsg/aframe-teleport-controls/v2.2.1/dist/aframe-teleport-controls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r123/examples/js/loaders/GLTFLoader.js"></script>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
      }
      .info {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.5);
        color: white;
        padding: 10px;
        border-radius: 5px;
      }
      .highlight {
        color: #ff0;
      }
    </style>
  </head>
  <body>
    <div class="info">
      <h2>Interactive A-Frame Art</h2>
      <p>
        Explore the 3D environment, interact with objects, and enjoy the
        immersive experience!
      </p>
    </div>
    <a-scene
      inspector
      background="color: #ECECEC"
      environment="preset: forest"
      vr-mode-ui="enabled: true"
    >
      <!-- Lights -->
      <a-light type="ambient" color="#888"></a-light>
      <a-light
        type="point"
        intensity="1"
        position="2 4 4"
        color="#FFF"
      ></a-light>

      <!-- Text -->
      <a-text
        value="Seja Bem-vindo, desfrute da obra!"
        position="-2 4 -5"
        color="#fff"
        width="6"
      ></a-text>

      <!-- 3D Model -->
      <a-entity
        gltf-model="#tree"
        position="0 0 -3"
        scale="1 1 1"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 10000"
      ></a-entity>

      <!-- Magica Voxel Model -->
      <a-entity
        static-body
        position="-2 1 -4"
        scale="0.5 0.5 0.5"
        magica-voxel-model="url(https://cdn.aframe.io/examples/models/magica-voxel/voxel-crate/voxel-crate.json)"
        class="interactive"
      ></a-entity>

      <!-- Portal -->
      <a-entity
        geometry="primitive: ring; radiusInner: 1.5; radiusOuter: 2"
        material="color: #00f"
        position="3 1.5 -6"
        class="portal"
        event-set__click="_event: click; material.color: #f00"
        teleport-to="#new-location"
      ></a-entity>

      <!-- 360º VR -->
      <a-sky
        src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/sechelt.jpg"
      ></a-sky>

      <!-- Sound -->
      <a-sound
        src="https://cdn.aframe.io/basic-guide/audio/backgroundnoise.wav"
        autoplay="true"
        loop="true"
        position="0 1.6 -2"
      ></a-sound>

      <!-- Interactions -->
      <a-box
        position="-1 0.5 -3"
        rotation="0 45 0"
        color="#ff0000"
        event-set__mouseenter="_event: mouseenter; material.color: #ffff00"
        event-set__mouseleave="_event: mouseleave; material.color: #4CC3D9"
        class="interactive"
      ></a-box>

      <!-- Proximity -->
      <a-entity
        id="proximity-sphere"
        geometry="primitive: sphere; radius: 1"
        material="color: #00f; opacity: 0.5"
        position="0 1 -2"
        class="interactive"
       animation__a1="property: scale; to: 1.5 1.5 1.5; dur: 300; startEvents: mouseenter" animation__a2="property: scale; to: 1 1 1; dur: 300; startEvents: mouseleave">
        
        
      </a-entity>

      <!-- Teleport Location -->
      <a-entity
        id="new-location"
        position="0 1.6 -10"
        geometry="primitive: plane; width: 2; height: 2"
        material="color: #00ff00"
      ></a-entity>
    </a-scene>
  
</body>
</html>
