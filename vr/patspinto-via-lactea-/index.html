<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Origem: backup do Glitch, projeto "patspinto-via-lactea-" (cópia de 2025-12-24 19:57) -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>via lactea</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/acspt/a-frame-animation-camera-components@0.0.1/dist/a-frame-animation-camera-alongpath.min.js"></script>
       <script src="
https://cdn.jsdelivr.net/npm/aframe-curve-component@0.1.3/dist/aframe-curve-component.min.js
"></script>

    <script src="
https://cdn.jsdelivr.net/npm/aframe-alongpath-component@1.0.5/index.min.js
"></script>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="info">
      <h1>Solar System</h1>
      <p>Explore the Solar System with A-Frame!</p>
    </div>
    <a-scene>
      <!-- imagem hdr fundão -->
      <a-sky
        src="assets/outer-space-background.jpg"
      ></a-sky>

      <!-- Sun with interactivity and light -->

      <!-- Sun with interactivity and light -->
      <a-sphere
        id="sun"
        position="0 1 -5"
        radius="1.5"
        color="yellow"
        emissive="yellow"
        emissive-intensity="0.9"
        event-set__mouseenter="color: blue"
        event-set__mouseleave="color: yellow"
      ></a-sphere>

      <!-- Mercurio -->
      <a-sphere position="2 1 -5" radius="0.05" color="gray"></a-sphere>

      <!-- Venus -->
      <a-sphere position="3 1 -5" radius="0.1" color="orange"></a-sphere>

      <!-- terra e lua  -->
      <a-entity position="4 1 -5">
        <a-sphere
          id="earth"
          radius="0.1"
          src="assets/earth_atmos_2048.jpg"
          animation="property: rotation; to: 0 360 0; dur: 10000; loop: true; easing: linear"
        ></a-sphere>
        <a-entity
          rotation="0 0 0"
          animation="property: rotation; to: 0 360 0; dur: 10000; loop: true; easing: linear"
        >
          <a-sphere
            id="moon"
            radius="0.03"
            color="white"
            position="0.2 0 0"
          ></a-sphere>
        </a-entity>
      </a-entity>

      <!-- Marte -->
      <a-sphere position="5 1 -5" radius="0.07" color="red"></a-sphere>

      <!-- Jupiter -->
      <a-sphere position="7 1 -5" radius="0.5" color="orange"></a-sphere>

      <!-- Saturno -->
      <a-sphere position="9 1 -5" radius="0.4" color="yellow"></a-sphere>
      <a-ring
        position="9 1 -5"
        radius-inner="0.5"
        radius-outer="0.7"
        color="brown"
      ></a-ring>

      <!-- Urano -->
      <a-sphere position="11 1 -5" radius="0.3" color="lightblue"></a-sphere>

      <!-- Neptuno -->
      <a-sphere position="13 1 -5" radius="0.3" color="blue"></a-sphere>

      <a-curve id="path" closed="false" type="Spline">
        <a-curve-point position="0 0 0"></a-curve-point>
        <a-curve-point position="10 0 0"></a-curve-point>
        <a-curve-point position="0 0 -5"></a-curve-point>
        <a-curve-point position="15 0  0"></a-curve-point>
      </a-curve>
      <!-- Camera -->

      <a-curve id="circlePath" curve="closed:true;type:CubicBezier">
    <a-curve-point position="9 1 -5"></a-curve-point>
      <a-curve-point position="7 1 -3"></a-curve-point>
      <a-curve-point position="5 1 -3"></a-curve-point>
      <a-curve-point position="3 1 -5"></a-curve-point>
      <a-curve-point position="5 1 -7"></a-curve-point>
      <a-curve-point position="7 1 -7"></a-curve-point>
      <a-curve-point position="9 1 -5"></a-curve-point>
      <a-curve-point position="11 1 -3"></a-curve-point>
      <a-curve-point position="13 1 -3"></a-curve-point>
      <a-curve-point position="15 1 -5"></a-curve-point>
      <a-curve-point position="13 1 -7"></a-curve-point>
      <a-curve-point position="11 1 -7"></a-curve-point>
      </a-curve>
      <!--
      <a-box
        id="pointer"
        width="0.1"
        height="0.10"
        depth="5"
        color="red"
        position="20 0 0"
        alongpath="curve: #circlePath; loop: true; dur: 10000; rotate:false"
      ></a-box>
      <a-entity
        aclone-along-curve="curve: #circlePath; spacing: 0.02; scale: 1 1 1; rotation: 0 0 0;"
        geometry="primitive:box; corlor:green: height:0.1; width:0.2; depth:0.1"
      ></a-entity>
       Animate the camera along the path -->
      <a-camera
        wasd-controls
        look-controls
        id="cameraRig"
        animation-camera-alongpath="curve: #circlePath; loop: true; dur: 100000; delay: "10000000"; rotate:false"
        position="0 1.6 0"
      >
      </a-camera>
      <!-- Draw the Curve -->

      <!-- Musica   -->
      <a-sound
        src="assets/y2mate.com---Interstellar-Main-Theme-Han.wav"
        autoplay="true"
        loop="true"
        position="0 1 -5"
      ></a-sound>

      <!-- texto via lactea -->
      <a-text value="VIA LACTEA" color="white" position="1 2 -3" scale="2 2 2" animation__a1="property: position; to: 4 4 -3; dur: 2000; dir: alternate; loop: true">
        
      </a-text>

      <!-- foguete -->
      <a-entity
        gltf-model="url(assets/rocket.glb)"
        position="2 2.5 -3"
        scale="0.1 0.1 0.1"
        animation="property: position; to: 2 3 -3; dir: alternate; dur: 2000; loop: true"
      ></a-entity>
    </a-scene>
  </body>
</html>
