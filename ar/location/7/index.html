<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Semear objetos virtuais no espaço físico - parte 2</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src='https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js'></script>  
</head>

<body style='margin: 0; overflow: hidden;'>
    <a-scene
        vr-mode-ui="enabled: false"
		arjs='sourceType: webcam; videoTexture: true; debugUIEnabled: false;'>

        <!-- a-assets: carrega as imagens da pasta assets antes de a cena começar -->
        <!-- cada imagem tem um id; as entidades usam-na com src="#id" -->
        <!-- nas imagens usa-se <img>; o a-asset-item é para outros ficheiros, como modelos 3D (.glb, .gltf) -->
        <a-assets>
            <img id="imagem1" src="assets/1.jpg" />
            <img id="imagem2" src="assets/2.jpg" />
            <img id="imagem3" src="assets/3.jpg" />
        </a-assets>

        <!-- ~ 400m far -->
        <!-- a imagem 3 aparece em todas as faces da caixa -->
        <a-box material="src: #imagem3;" scale="5 5 5" gps-entity-place="latitude: 44.506477; longitude: 11.301524;"></a-box>

        <!-- ~ 20m far -->
        <!-- width/height com a proporção da imagem (3024 x 4032 = 3:4), para não ficar deformada -->
        <a-image src="#imagem1" width="3" height="4" gps-entity-place="latitude: 44.504417; longitude: 11.301317;"
        ></a-image>

        <!-- ~ 0m far -->
        <!-- width/height com a proporção da imagem (3456 x 5184 = 2:3) -->
        <a-image src="#imagem2" width="2" height="3" gps-entity-place="latitude: 44.504348; longitude: 11.301027;"
            ></a-image>

        <!-- using gpsMinDistance: 5 => update GPS only if user moves by 5 meters or more => avoid shaking for near objects -->
        <!-- using accelerationToMove: 1.0 => 'smooth' inertial sensors precision precision in order to avoid distant places shaking -->
        <a-camera
            rotation-reader
            gps-camera="simulateLatitude: 44.50437; simulateLongitude: 11.30106; gpsMinDistance: 10;"
        >
		</a-camera>
	</a-scene>
</body>
