<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- the following script is needed for image tracking -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <!-- the following script is needed to animate gltf files -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <!-- targets.mind was compiled from assets/anchor.png -->
    <a-scene mindar-image="imageTargetSrc: assets/targets.mind; uiScanning: yes;"
             color-space="sRGB"
             renderer="colorManagement: true, physicallyCorrectLights"
             vr-mode-ui="enabled: false"
             device-orientation-permission-ui="enabled: false">
      <a-assets>
        <a-asset-item id="phoenix" src="assets/phoenix_bird.glb"></a-asset-item>
      </a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <!-- the phoenix is only visible while anchor.png is detected -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model src="#phoenix"
                      animation-mixer="clip: Take 001"
                      position="0.35 0 0.2"
                      rotation="90 0 0"
                      scale="0.001 0.001 0.001"></a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
