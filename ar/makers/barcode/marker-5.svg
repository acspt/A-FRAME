<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 8" width="600" height="600" shape-rendering="crispEdges">
  <!-- Margem branca à volta do marcador (necessária para a deteção) -->
  <rect width="8" height="8" fill="#fff" />
  <!-- Moldura preta -->
  <rect x="1" y="1" width="6" height="6" fill="#000" />
  <!-- Código de barras 3x3 com o valor 5 (células brancas) -->
  <rect x="3.5" y="2.5" width="2" height="1" fill="#fff" />
  <rect x="2.5" y="3.5" width="1" height="1" fill="#fff" />
  <rect x="4.5" y="3.5" width="1" height="2" fill="#fff" />
</svg>
