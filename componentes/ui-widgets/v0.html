<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <title>UI Widgets (v0): A-Frame Registry</title>
    <!--
      Versão v0 do componente "UI Widgets" (https://aframe.io/aframe-registry/)
      O conteúdo do BODY é o exemplo do README do componente (aframe-ui-widgets@1.0.2 (inclui o A-Frame 0.5.0)).
      Ajustes: position no botão (no README fica na origem, aos pés da câmara). Precisa de comandos VR para carregar no botão.
    -->
    <script src="https://unpkg.com/aframe-ui-widgets@1.0.2/dist/aframe-ui-widgets.min.js"></script>
  </head>
<body>
  <a-scene>
    <!-- Adds hand controls -->
    <a-entity hand-controls="left"></a-entity>
    <a-entity hand-controls="right"></a-entity>

    <!-- Can also be controlled used with cursor -->
    <a-camera>
      <a-cursor></a-cursor>
    </a-camera>

    <!-- Adds UI button widget -->
    <a-entity id="mybutton" ui-button position="0 1.2 -0.6"></a-entity>
  </a-scene>
  <script>
  var mybutton = document.querySelector('#mybutton');
  mybutton.addEventListener('pressed', function () {
    // do stuff here.
  });
  </script>
</body>
</html>
