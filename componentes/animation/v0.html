<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <title>Animation (v0): A-Frame Registry</title>
    <!--
      Versão v0 do componente "Animation" (https://aframe.io/aframe-registry/)
      O conteúdo do BODY é o exemplo do README do componente (aframe-animation-component@5.1.2).
      Ajustes: faltava o > a fechar a segunda a-entity e os dois pontos em from: 0 e from: 1; posições (position) para os objetos ficarem à frente da câmara (no README estão todos na origem, aos pés da câmara).
    -->
    <script src="https://aframe.io/releases/0.8.2/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-animation-component@5.1.2/dist/aframe-animation-component.min.js"></script>
  </head>
<body>
  <a-scene>
    <a-entity geometry="primitive: box" material="color: black" position="-1.5 1 -3"
              animation__color="property: material.color; dir: alternate; dur: 1000;
                                easing: easeInSine; loop: true; to: #FFF">
    </a-entity>

    <a-entity geometry="primitive: box" material="color: orange" position="0 1 -3"
              animation__fadein="property: material.opacity; dur: 100;
                                  easing: linear; from: 0; to: 1; startEvents: fadein"
              animation__fadeout="property: material.opacity; dur: 100;
                                  easing: linear; from: 1; to: 0; startEvents: fadeout">
    </a-entity>

    <a-cylinder color="#F55" radius="0.1" position="1.5 1 -3"
                animation="property: color; dir: alternate; dur: 1000;
                           easing: easeInSine; loop: true; to: #5F5"
                animation__scale="property: scale; dir: alternate; dur: 200;
                           easing: easeInSine; loop: true; to: 1.2 1 1.2"
                animation__yoyo="property: position; dir: alternate; dur: 1000;
                                 easing: easeInSine; loop: true; to: 1.5 2 -3">
    </a-cylinder>

  </a-scene>
</body>
</html>
