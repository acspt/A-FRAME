<!DOCTYPE html>
<html>
  <head>
    <!-- Origem: backup do Glitch, projeto "chip-curved-soapwort" (cópia de 2025-12-24 19:55) -->
    <title>Welcome to Glitch!</title>
    <meta name="description" content="A cool thing made with Glitch">
    <link id="favicon" rel="icon" href="https://glitch.com/edit/favicon-app.ico" type="image/x-icon">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://aframe.io/releases/0.5.0/aframe.min.js"></script>
    <script src="./js/index.js"></script>
  </head>
  <body>
    <a-scene>
      <a-sphere material-displacement
                scale="1 1 1"
                radius="0.2"
                position="0 1.5 -2"
                segments-height="128"
                segments-width="128" animation__a1="property: scale; from: 1 1 1; to: 4 4 4; dur: 5000; dir: alternate; loop: true">
        
      </a-sphere>
      <a-box color="#CCC" width="3" depth="3" height="0.1" position="0 0 -2"></a-box>
    </a-scene>
  </body>
</html>
