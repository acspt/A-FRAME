<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <title>Stats In VR: A-Frame Registry</title>
    <!--
      Componente "Stats In VR" do A-Frame Registry (https://aframe.io/aframe-registry/)
      Mostra as estatísticas de desempenho (FPS) dentro da cena, também em modo VR.
      O painel de estatísticas aparece à frente da câmara, mesmo em VR.
    -->
    <script src="https://aframe.io/releases/0.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-stats-in-vr-component@0.1.7/dist/aframe-stats-in-vr-component.min.js"></script>
  </head>
  <body>
    <a-scene stats-in-vr>
      <a-box position="0 1 -3" rotation="0 45 0" color="#C03546"
             animation="property: rotation; to: 0 405 0; dur: 4000; easing: linear; loop: true"></a-box>
      <a-sky color="#3CF"></a-sky>
    </a-scene>
  </body>
</html>
