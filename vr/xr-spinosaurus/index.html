<!DOCTYPE html>
<html lang="pt">
  <head>
    <title>XR Spinosaurus: VR, AR e computador</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- aframe-extras: componente animation-mixer, que corre as animações do modelo glTF
         (o modelo atual não tem animações; com um modelo animado, passa a mexer-se sozinho) -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@v7.4.0/dist/aframe-extras.min.js"></script>
    <!-- aframe-environment-component: cria o ambiente (floresta) -->
    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets timeout="30000">
        <!-- modelo do spinosaurus, na pasta assets deste exemplo -->
        <a-asset-item
          id="spinosaurus"
          src="assets/spinosaurus.glb"
        ></a-asset-item>
      </a-assets>

      <a-camera position="0 1.2 0"></a-camera>

      <!-- Ambiente para o computador e para VR.
           hide-on-enter-ar (já vem no A-Frame): esconde-o em AR, para se ver a câmara do telemóvel. -->
      <a-entity
        environment="preset: forest; lighting: none; shadow: none; lightPosition: 0 2.15 0"
        hide-on-enter-ar
      ></a-entity>

      <!-- O dinossauro; os botões mudam a escala desta entidade -->
      <a-entity id="dino" position="-1 0 -3" scale="0.5 0.5 0.5">
        <!-- y = -2.25: o centro deste modelo está acima das patas; assim as patas ficam no chão -->
        <a-entity
          position="0 -2.25 0"
          rotation="0 55 0"
          gltf-model="#spinosaurus"
          animation-mixer
          shadow="cast: true; receive: false"
        ></a-entity>
      </a-entity>

      <!-- Luzes: a direcional aponta para o dinossauro e faz sombra -->
      <a-entity light="type: ambient; intensity: 0.5"></a-entity>
      <a-entity
        id="light"
        position="-5 3 1.5"
        light="type: directional;
               target: #dino;
               castShadow: true;
               shadowMapHeight: 1024;
               shadowMapWidth: 1024;
               shadowCameraLeft: -7;
               shadowCameraRight: 5;
               shadowCameraBottom: -5;
               shadowCameraTop: 5"
      ></a-entity>

      <!-- Plano que só aparece em AR e só mostra a sombra do dinossauro (componente ar-shadows) -->
      <a-plane
        height="15"
        width="15"
        position="0 0 -3"
        rotation="-90 0 0"
        shadow="receive: true"
        ar-shadows="opacity: 0.3"
        visible="false"
      ></a-plane>
    </a-scene>

    <div id="text">
      <h1>A-Frame Spinosaurus para VR/AR</h1>
      <p>
        Tamanho:
        <button id="btn_full">Inteiro</button>
        <button id="btn_half">1/2</button>
        <button id="btn_quarter">1/4</button>
      </p>
      <p class="creditos">
        Modelo:
        <a href="https://sketchfab.com/3d-models/spinosaurus-2135501583704537907645bf723685e7" target="_blank">Spinosaurus</a>,
        de <a href="https://sketchfab.com/VapTor" target="_blank">Vaptor-Studio</a>.
        AR precisa de um telemóvel Android com
        <a href="https://developers.google.com/ar/devices" target="_blank">ARCore</a> e Chrome.
      </p>
    </div>

    <!-- código do projeto (componente ar-shadows e botões de tamanho), no fim da página -->
    <script src="scripts.js"></script>
  </body>
</html>
