<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <title>Extras: Animation Mixer: A-Frame Registry</title>
    <!--
      Componente "Extras: Animation Mixer" do A-Frame Registry (https://aframe.io/aframe-registry/)
      Toca as animações que vêm dentro de modelos glTF.
      O CesiumMan caminha usando a animação guardada no ficheiro .glb.
    -->
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.7.0/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <a-asset-item id="homem" src="assets/CesiumMan.glb"></a-asset-item>
      </a-assets>

      <!-- animation-mixer toca todas as animacoes do modelo (ou uma, com clip: nome) -->
      <a-entity gltf-model="#homem" animation-mixer position="0 0 -3" rotation="0 -90 0" scale="1.5 1.5 1.5"></a-entity>

      <a-plane rotation="-90 0 0" width="6" height="6" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
