<!DOCTYPE html>
<html>
  <head>
    <title>Cinema 360</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Mundo/Assets -->

      <a-entity environment="preset: forest; playArea: 20;"></a-entity>

      <a-camera id="rig" class="camera" position="10 1.6 20"
        ><a-cursor></a-cursor
      ></a-camera>

      <a-assets>
        <a-asset-item
          id="Booth1"
          src="assets/ticket_booth.glb"
        ></a-asset-item>
      </a-assets>

      <a-assets>
        <a-asset-item
          id="Board"
          src="assets/cork_board.glb"
        ></a-asset-item>
      </a-assets>

      <a-assets>
        <a-asset-item
          id="Btn1"
          src="assets/button.glb"
        ></a-asset-item>
      </a-assets>

      <a-assets>
        <a-asset-item
          id="robot1"
          src="assets/k-vrc.glb"
        ></a-asset-item>
      </a-assets>

      <a-assets>
        <a-asset-item
          id="robot2"
          src="assets/robot.glb"
        ></a-asset-item>
      </a-assets>

      <a-assets>
        <a-asset-item
          id="btn2"
          src="assets/button_round_flat.glb"
        ></a-asset-item>
      </a-assets>

      <a-assets>
        <a-asset-item
          id="portal"
          src="assets/sci-fi_portal_-_asset.glb"
        ></a-asset-item>
      </a-assets>

      <a-assets>
        <a-asset-item
          id="booth2"
          src="assets/ticket_booth-1-.glb"
        ></a-asset-item>
      </a-assets>

      <a-assets>
        <audio
          id="musicbox"
          src="assets/Joyful-heart--loop----Uplifting-acoustic.wav"
        ></audio>
      </a-assets>

      <!-- Objetos -->

      <!-- Guia -->

      <a-entity
        id="guia"
        gltf-model="#robot2"
        position="10 0.3 17"
        scale="0.19 0.19 0.19"
        rotation="0 90 0"
        sound="src: url(assets/Joyful-heart--loop----Uplifting-acoustic.wav); on: click; loop: true"
      ></a-entity>

      <a-text
        id="guiatalk"
        value="Bem vindo ao Simulador de Cinema 360"
        scale="0.5 0.5 0.5"
        position="10 3 17"
        align="center"
        color="yellow"
      ></a-text>

      <!-- Localização para onde o objeto guia será movido -->
      <a-sphere
        id="destino"
        position="-7 0 15"
        color="red"
        radius="0.05"
      ></a-sphere>

      <!-- a-box-_- -->

      <a-box position="-14 2 10.23" color="white" height="4" depth="7"></a-box>

      <!-- Barraca1 -->

      <a-entity
        gltf-model="#Booth1"
        position="-10 0 10"
        scale="0.25 0.25 0.25"
        rotation="0 90 0"
      ></a-entity>

      <!-- Charada -->

      <a-entity
        id="charada"
        gltf-model="#Board"
        position="-10 2 6"
        scale="1 1 1"
        rotation="0 90 0"
        cursor-listener
        ><a-text
          cursor-listener
          rotation=""
          value="O que e, o que e? Quanto mais se tira, \n maior ele fica."
          position="0 0.3 0.3"
          align="center"
          visible="false"
          color="yellow"
        ></a-text
      ></a-entity>

      <!-- Respostas -->

      <a-entity
        id="resposta2"
        gltf-model="#Btn1"
        position="-9.7 1 7"
        scale="2 2 2"
        rotation="0 90 0"
        cursor-listener
      ></a-entity>
      <a-text
        value="Uma divida"
        scale="0.5 0.5 0.5"
        position="-9.7 1.4 7"
        align="center"
        rotation="0 90 0"
      ></a-text>

      <a-entity
        id="resposta1"
        gltf-model="#Btn1"
        position="-9.7 1 6"
        scale="2 2 2"
        rotation="0 90 0"
        cursor-listener
      ></a-entity>
      <a-text
        value="Um buraco"
        scale="0.5 0.5 0.5"
        position="-9.7 1.4 6"
        align="center"
        rotation="0 90 0"
      ></a-text>

      <a-entity
        id="resposta3"
        gltf-model="#Btn1"
        position="-9.7 1 5"
        scale="2 2 2"
        rotation="0 90 0"
        color="white"
        cursor-listener
      ></a-entity>
      <a-text
        value="Um balao"
        scale="0.5 0.5 0.5"
        position="-9.7 1.4 5"
        align="center"
        rotation="0 90 0"
      ></a-text>

      <!-- Texto output-->
      <a-text
        id="acertou"
        value="Conseguiste obter a permissao para ver o filme! Passa pela proxima barraca para validar o teu bilhete "
        position="-9.8 3 6"
        align="center"
        visible="false"
        color="white"
        rotation="0 90 0"
        scale="0.7 0.7 0.7"
      ></a-text>
      <a-text
        id="erro"
        value="Resposta errada. Tenta de Novo!"
        position="-9.8 3 6"
        align="center"
        visible="false"
        color="red"
        rotation="0 90 0"
        scale="0.7 0.7 0.7"
      ></a-text>

      <!-- Robo 1 -->
      <a-entity
        id="anima"
        gltf-model="#robot1"
        position="-10 0 10.23"
        scale=""
        rotation="0 90 0"
      ></a-entity>

      <!-- Sensor de proximidade -->

      <a-box
        id="sensor"
        position="-6 0 10.23"
        color="white"
        height="2"
        depth="4"
      ></a-box>

      <a-text
        id="talk"
        value="Ola o meu nome e BIT"
        position="-9 2 9.5"
        align="center"
        rotation="0 90 0"
        scale="0.9 0.9 0.9"
        visible="false"
      ></a-text>

      <!--  -->

      <a-entity
        gltf-model="#booth2"
        position="1 0 -3"
        scale="1 1 1"
        rotation="0 180 0"
      ></a-entity>

      <a-entity
        id="anima2"
        gltf-model="#robot1"
        position="1 0 -3"
        scale=""
        rotation="0 -90 0"
      ></a-entity>

      <!-- Sensor de proximidade -->

      <a-box
        id="sensor2"
        position="-3 0 -3"
        color="white"
        height="2"
        depth="4"
      ></a-box>

      <a-text
        id="talk2"
        value="Ola o meu nome e BOT"
        position="-1 2 -3"
        align="center"
        rotation="0 -90 0"
        scale="0.9 0.9 0.9"
        visible="false"
      ></a-text>

      <a-box position="-1 0 -3" color="white" height="2" depth="2"></a-box>

      <a-entity
        id="minha-caixa"
        gltf-model="#btn2"
        position="-1 1 -2"
        scale=""
        rotation="0 -90 0"
      ></a-entity>

      <a-text
        id="val"
        value="Validado com sucesso"
        position="-3 2 -3"
        align="center"
        rotation="0 -90 0"
        scale="0.9 0.9 0.9"
        visible="false"
        color="green"
      ></a-text>

      <a-text
        id="val2"
        value="Tens que acertar a resposta da charada"
        position="-3 2 -3"
        align="center"
        rotation="0 -90 0"
        scale="0.9 0.9 0.9"
        visible="false"
        color="red"
      ></a-text>

      <!-- Portal -->
      <a-entity
        id="portal1"
        gltf-model="#portal"
        position="0 100 0"
        scale="1 1 1"
        rotation="0 0 0"
        visible="false"
        ><a-link
          position="0 1 0"
          scale="0.5 0.5 0.5"
          href="vid/01.html"
          title="."
        ></a-link>
        <a-text
          value="Passeio na Zona Verde"
          position="0 3 0"
          align="center"
          scale="0.9 0.9 0.9"
        ></a-text
      ></a-entity>

      <a-entity
        id="portal2"
        gltf-model="#portal"
        position="0 100 0"
        scale="1 1 1"
        rotation="0 0 0"
        visible="false"
        ><a-link
          position="0 1 0"
          scale="0.5 0.5 0.5"
          href="vid/02.html"
          title="."
        ></a-link>
        <a-text
          value="Passeio de Carro"
          position="0 3 0"
          align="center"
          scale="0.9 0.9 0.9"
        ></a-text
      ></a-entity>

      <!-- ##################Scripts###################333 -->









    </a-scene>

    <!-- scripts do projeto, carregados no fim da página -->
    <script src="scripts.js"></script>
  </body>
</html>
