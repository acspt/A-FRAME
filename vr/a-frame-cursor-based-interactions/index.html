<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Rodar objetos com o olhar (cursor)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Câmara com um cursor no centro do ecrã.
           O cursor só deteta os objetos com a classe "clickable".
           fuse: olhar fixamente 1,5 segundos para um objeto conta como um clique. -->
      <a-entity id="camera" camera look-controls position="0 1.6 0">
        <a-cursor
          color="red"
          fuse="true"
          fuse-timeout="1500"
          raycaster="objects: .clickable"
        ></a-cursor>
      </a-entity>

      <!-- Objetos que rodam enquanto o cursor está em cima deles (componente rotate-on-gaze) -->
      <a-box id="box"
        class="clickable"
        rotate-on-gaze
        position="-1 0.5 -3"
        rotation="0 45 0"
        color="#4CC3D9"
        width="1"
        height="1"
        depth="1"
      ></a-box>
      <a-sphere id="sphere"
        class="clickable"
        rotate-on-gaze
        position="0 1.25 -5"
        radius="1.25"
        color="#EF2D5E"
      ></a-sphere>
      <!-- speed: velocidade de rotação em radianos por segundo (por omissão 1.5) -->
      <a-cylinder id="cylinder"
        class="clickable"
        rotate-on-gaze="speed: 3"
        position="1 0.75 -3"
        rotation="90 0 0"
        radius="0.5"
        height="1.5"
        color="#FFC65D"
      ></a-cylinder>

      <!-- Luzes -->
      <a-light type="ambient" color="#445451"></a-light>
      <a-light type="point" position="2 4 4" intensity="0.4"></a-light>

      <!-- Chão -->
      <a-plane
        position="0 0 -4"
        rotation="-90 0 0"
        width="4"
        height="4"
        color="#7BC8A4"
      ></a-plane>
    </a-scene>

    <!-- código do projeto (componente rotate-on-gaze), no fim da página -->
    <script src="scripts.js"></script>
  </body>
</html>
