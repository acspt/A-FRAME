<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Localização</title>
    <!-- estilos da página -->
    <link rel="stylesheet" href="styles.css" />
    <!-- A-Frame e AR.js (versão com localização) em versões fixas -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>
    <!-- biblioteca de física: deteta colisões entre entidades e lança o evento collide -->
    <script src="https://cdn.jsdelivr.net/npm/@c-frame/aframe-physics-system@4.2.4/dist/aframe-physics-system.min.js"></script>
    <!-- jQuery: usado em script.js, por isso tem de ser carregado antes dele -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- componentes próprios: têm de ser registados antes de a cena ser criada -->
    <script src="script.js"></script>
  </head>
  <body>
    <!-- sourceWidth/sourceHeight: resolução pedida à câmara; por omissão é 640x480, o que deixa o vídeo desfocado -->
    <!-- videoTexture: false: o vídeo aparece por trás da cena e mantém a proporção; com true era esticado e ficava deformado -->
    <!-- physics gravity 0: liga a física, sem gravidade (a esfera não cai) -->
    <a-scene
      physics="gravity: 0"
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; videoTexture: false; debugUIEnabled: false; sourceWidth: 1280; sourceHeight: 960;"
    >
      <!-- gps-camera sem simulação: usa o GPS real do telemóvel -->
      <!-- (para testar no PC: gps-camera="simulateLatitude: 41.478107; simulateLongitude: -7.177743", 10 m a norte da esfera) -->
      <!-- static-body: corpo físico do utilizador, uma esfera com 4 m de raio à volta da câmara -->
      <a-camera
      gps-camera
        rotation-reader
        static-body="shape: sphere; sphereRadius: 4"
      >
        <!-- texto dentro da câmara: anda com ela e fica sempre visível, no topo do ecrã (y positivo = para cima) -->
        <!-- mostrar-gps (script.js): escreve a latitude, a longitude e a precisão do GPS -->
        <!-- geometry + material: fundo preto meio transparente, para o texto se ler sobre o vídeo -->
        <a-text
          value="A procurar GPS..."
          position="0 0.7 -2"
          width="1"
          align="center"
          color="#ffffff"
          geometry="primitive: plane; width: auto; height: auto"
          material="color: #000000; opacity: 0.5"
          mostrar-gps
        ></a-text>
      </a-camera>
      <!-- esfera colocada na EsACT (Escola Superior de Comunicação, Administração e Turismo, Mirandela) -->
      <!-- coordenadas retiradas do Google Maps: 41.478017, -7.177743 -->
      <!-- afastar-ao-colidir (script.js): liga a física (dynamic-body) depois de o GPS colocar a esfera -->
      <!-- e, quando colide com o corpo do utilizador (a menos de 9 m do centro), afasta a esfera na direção câmara → esfera -->
      <a-sphere
        radius="5"
        color="#ff0000"
        gps-entity-place="latitude: 41.477900; longitude: -7.177655;"
        afastar-ao-colidir
      ></a-sphere>
    </a-scene>
  </body>
</html>
