<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <title>Particle System: A-Frame Registry</title>
    <!--
      Componente "Particle System" do A-Frame Registry (https://aframe.io/aframe-registry/)
      Sistemas de partículas: neve, chuva, pó, estrelas.
      Neve a cair sobre a cena. Muda o preset para rain, dust ou default.
    -->
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-particle-system-component@1.1.3/dist/aframe-particle-system-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- preset: snow, rain, dust ou default -->
      <a-entity position="0 2.25 -15" particle-system="preset: snow; particleCount: 5000"></a-entity>

      <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
      <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
      <a-sky color="#000"></a-sky>
    </a-scene>
  </body>
</html>
