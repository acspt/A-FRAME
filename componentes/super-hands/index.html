<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <title>Super Hands: A-Frame Registry</title>
    <!--
      Componente "Super Hands" do A-Frame Registry (https://aframe.io/aframe-registry/)
      Interação natural com as mãos/comandos: agarrar, esticar, arrastar e largar.
      Com o rato: carrega numa caixa e arrasta para a mover. Em VR, agarra com o gatilho dos comandos.
    -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@5.1.0/dist/aframe-event-set-component.min.js"></script>
    <script src="https://unpkg.com/super-hands@3.0.6/dist/super-hands.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <!-- Mixin para as caixas: podem ser agarradas, esticadas, arrastadas e largadas -->
        <a-mixin id="caixa" geometry="primitive: box; width: 0.5; height: 0.5; depth: 0.5"
                 hoverable grabbable stretchable draggable droppable
                 event-set__hoveron="_event: hover-start; material.opacity: 0.7; transparent: true"
                 event-set__hoveroff="_event: hover-end; material.opacity: 1; transparent: false"></a-mixin>
      </a-assets>

      <!-- Rato: o cursor serve de "mao" do super-hands -->
      <a-entity cursor="rayOrigin: mouse" raycaster="objects: .cubo"
                super-hands="colliderEvent: raycaster-intersection; colliderEventProperty: els;
                             colliderEndEvent: raycaster-intersection-cleared; colliderEndEventProperty: clearedEls"></a-entity>

      <!-- Comandos VR -->
      <a-entity laser-controls="hand: right" raycaster="objects: .cubo"
                super-hands="colliderEvent: raycaster-intersection; colliderEventProperty: els;
                             colliderEndEvent: raycaster-intersection-cleared; colliderEndEventProperty: clearedEls"></a-entity>

      <a-entity class="cubo" mixin="caixa" position="-1 1.2 -2.5" material="color: #EF2D5E"></a-entity>
      <a-entity class="cubo" mixin="caixa" position="0 1.6 -2.5" material="color: #4CC3D9"></a-entity>
      <a-entity class="cubo" mixin="caixa" position="1 1.2 -2.5" material="color: #FFC65D"></a-entity>

      <a-plane rotation="-90 0 0" width="8" height="8" color="#7BC8A4"></a-plane>
      <a-camera look-controls="enabled: false"></a-camera>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
