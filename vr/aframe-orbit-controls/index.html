<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Orbit: rodar a câmara à volta de um ponto</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- componente orbit-controls: a câmara roda à volta de um ponto (target) -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>
    <style>
      #ajuda {
        position: fixed; top: 12px; left: 12px; z-index: 10;
        background: rgba(0, 0, 0, 0.6); color: #fff;
        font: 14px/1.4 sans-serif; padding: 8px 12px; border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div id="ajuda">
      Arrastar: rodar à volta do objeto<br />
      Roda do rato / dois dedos: aproximar e afastar
    </div>

    <a-scene background="color: #ECECEC">
      <!-- o ponto central da órbita é o target (0 1.25 -5), onde está a caixa -->
      <a-box position="0 1.25 -5" rotation="0 45 0" color="#4CC3D9"></a-box>
      <a-sphere position="1.5 1.25 -6" radius="0.5" color="#EF2D5E"></a-sphere>
      <a-cylinder position="-1.5 0.75 -4" radius="0.4" height="1.5" color="#FFC65D"></a-cylinder>
      <a-plane position="0 0 -5" rotation="-90 0 0" width="8" height="8" color="#7BC8A4"></a-plane>

      <!-- câmara com orbit-controls; look-controls e wasd-controls desligados para não entrarem em conflito -->
      <a-entity
        camera
        position="0 0 0"
        look-controls="enabled: false"
        wasd-controls="enabled: false"
        orbit-controls="target: 0 1.25 -5; initialPosition: 0 4 2; minDistance: 2; maxDistance: 15; enableDamping: true; rotateSpeed: 0.5"
      ></a-entity>
    </a-scene>
  </body>
</html>
