<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Câmara em movimento</title>
    <!-- Origem: backup do Glitch, projeto "a-aframe-moving-camera" -->
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <!-- função moveCamera, chamada pelo botão "Move Camera" -->
    <script src="script.js"></script>
  </head>
  <body>
    <a-scene background="color: #FAFAFA">
      <a-entity id="cameraWrapper" position="0 0 0">
        <!-- a câmara avança até z = -10 em 2 segundos -->
        <!-- no original usava <a-animation>, que já não existe no A-Frame 1.x; agora usa o componente animation -->
        <a-camera
          wasd-controls-enabled="false"
          look-controls="reverseMouseDrag: true"
          animation="property: position; to: 0 1.6 -10; dur: 2000; easing: linear"
        ></a-camera>
      </a-entity>
      <a-sky color="#c7dcff"></a-sky>
      <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9" shadow></a-box>
      <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E" shadow></a-sphere>
      <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D" shadow></a-cylinder>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4" shadow></a-plane>
    </a-scene>

    <!-- botão HTML por cima da cena: roda a câmara suavemente para uma direção -->
    <button type="button" style="position: fixed; top: 10px; left: 10px" onclick="moveCamera(-0.1, 0.85)">
      Move Camera
    </button>
  </body>
</html>
