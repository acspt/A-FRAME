<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <title>Rain: A-Frame Registry</title>
    <!--
      Componente "Rain" do A-Frame Registry (https://aframe.io/aframe-registry/)
      Chuva a cair à volta da câmara.
      Chuva sobre uma cena simples.
    -->
    <script src="https://aframe.io/releases/0.7.1/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-rain@1.0.2/build/aframe-rain.min.js"></script>
  </head>
  <body>
    <a-scene rain>
      <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
      <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
      <a-plane rotation="-90 0 0" width="20" height="20" color="#456"></a-plane>
      <a-light type="ambient" color="#666"></a-light>
      <a-light type="directional" position="1 2 1" intensity="0.6"></a-light>
      <a-sky color="#222"></a-sky>
    </a-scene>
  </body>
</html>
