<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Smooth Door Animation in A-Frame</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Door entity with animation component for smooth rotation -->
      <a-box
        id="door"
        position="0 0 -4"
        rotation="0 0 0"
        depth="0.1"
        height="2.5"
        width="1.5"
        color="#654321"
     animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear;"  >
      </a-box>

      <!-- Invisible plane for detecting clicks to toggle door state -->
    
      <!-- Camera with cursor for interaction -->
      <a-camera>
        <a-cursor></a-cursor>
      </a-camera>
    </a-scene>
  
    <!-- Bibliotecas usadas nesta página (clicar para abrir a lista) -->
    <details class="bibliotecas-usadas" style="position:fixed;bottom:10px;left:10px;z-index:9999;max-width:340px;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,0.7);color:#fff;font:12px/1.4 Arial,sans-serif">
      <summary style="cursor:pointer">&#8505;&#65039; Bibliotecas</summary>
      <ul style="margin:6px 0 0;padding-left:16px">
        <li><a href="https://aframe.io" target="_blank" rel="noopener" style="color:#87ceeb">A-Frame</a> 1.2.0</li>
      </ul>
    </details>
</body>
</html>
