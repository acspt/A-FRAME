<!DOCTYPE html>
<html>
  <head>
    <title>multiple pseudo scenes</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-entity camera position="2 0 3" look-controls wasd-controls>
        <a-entity
          cursor="fuse: true; fuseTimeout: 1000"
          position="0 0 -1"
          geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
          material="color: black; shader: flat"
         animation__a1="property: scale; from: 0.1 0.1 0.1; to: 1 1 1; easing: easeInQuad; startEvents: click" animation__a2="property: scale; from: 1 1 1; to: 0.1 0.1 0.1; easing: easeInQuad; startEvents: cursor-fusing">
          
          
        </a-entity>
      </a-entity>

      <a-entity id="scene1">
        <a-sky color="#ffffff"></a-sky>

        <!-- <a-plane rotation="-90 0 0" position="0 -1 -3" width="8" height="8" color="#7BC8A4"></a-plane> -->
        <a-box color="red" onclick="setScene2()"> </a-box>


        <a-light id="ambient1" type="ambient" color="#4f6487" animation__a1="property: light.intensity; from: 0; to: 1; dur: 1000; delay: 100; startEvents: aaa">
          
        </a-light>

        <!-- <a-light type="directional" color="#FFF" position="-0.5 1 1">
        <a-animation attribute="intensity" from="0" to="1" delay="100" dur="1000" fill="both"></a-animation>
      </a-entity> -->
      </a-entity>

      <a-entity id="scene2" visible="false">
        <a-sky color="#aaaaaa"></a-sky>

        <!-- <a-entity id="fading-cube" geometry="primitive: box" material="opacity: 1">
        <a-animation attribute="material.opacity" begin="fade" to="0"></a-animation>
      </a-entity> -->

        <a-box color="green" position="0 2 -5"> </a-box>
        <a-box color="yellow" position="5 0 -5" onclick="setScene1()"> </a-box>
        <a-box color="blue" position="0 0 -3"> </a-box>

        <a-light id="ambient2" type="ambient" color="#FFFFFF" animation__a1="property: light.intensity; from: 0; to: 1; dur: 1000; delay: 100; startEvents: aaa">
          
        </a-light>
      </a-entity>
    </a-scene>

    <!-- scripts do projeto, carregados no fim da página -->
    <script src="script.js"></script>
  </body>
</html>
