<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <title>Extras: Json Model (v0): A-Frame Registry</title>
    <!--
      Versão v0 do componente "Extras: Json Model" (https://aframe.io/aframe-registry/)
      O conteúdo do BODY é o exemplo do README do componente (aframe-extras@4.2.0, src/loaders).
      Ajustes: o README usa my-model.json: aponta para assets/flamingo.js; scale e position porque o flamingo é muito grande.
    -->
    <script src="https://aframe.io/releases/0.8.2/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-extras.json-model@4.2.0/dist/aframe-extras.json-model.min.js"></script>
  </head>
<body>
  <a-scene>
    <!-- three.js JSON -->
    <a-entity json-model="src: url(assets/flamingo.js);" scale="0.02 0.02 0.02" position="0 1.6 -4"></a-entity>
  </a-scene>
</body>
</html>
