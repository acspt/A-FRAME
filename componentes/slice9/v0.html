<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <title>Slice9 (v0): A-Frame Registry</title>
    <!--
      Versão v0 do componente "Slice9" (https://aframe.io/aframe-registry/)
      O conteúdo do BODY é o exemplo do README do componente (aframe-slice9-component@1.0.0).
      Ajustes: o README tem slice9="foo: bar" (texto de modelo, a propriedade foo não existe): foi trocado pelas propriedades reais, com a imagem assets/tooltip.png, e foi acrescentada position.
    -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-slice9-component@1.0.0/dist/aframe-slice9-component.min.js"></script>
  </head>
<body>
  <a-scene>
    <a-entity slice9="width: 2; height: 1; left: 20; right: 43; top: 20; bottom: 43; src: assets/tooltip.png" position="0 1.6 -3"></a-entity>
  </a-scene>
</body>
</html>
