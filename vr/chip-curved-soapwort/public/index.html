<!DOCTYPE html>
<html>
  <head>
    <title>Esfera deformada com shaders</title>
    <meta name="description" content="Esfera com um ShaderMaterial que a deforma com uma função de ruído">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="./js/index.js"></script>
  </head>
  <body>
    <a-scene>
      <a-sphere material-displacement
                scale="1 1 1"
                radius="0.2"
                position="0 1.5 -2"
                segments-height="128"
                segments-width="128" animation__a1="property: scale; from: 1 1 1; to: 4 4 4; dur: 5000; dir: alternate; loop: true">
        
      </a-sphere>
      <a-box color="#CCC" width="3" depth="3" height="0.1" position="0 0 -2"></a-box>
    </a-scene>
  
</body>
</html>
