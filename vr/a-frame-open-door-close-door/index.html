<!DOCTYPE html>
<html lang="pt">
  <head>
    <title>A-Frame: abrir e fechar uma porta</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Rig: o "corpo" do utilizador. A câmara vai dentro dele.
           Quando a porta abre, o componente auto-door move o rig para dentro da casa. -->
      <a-entity id="rig" position="0 0 4">
        <!-- Câmara: anda com as teclas W A S D ou com as setas -->
        <a-camera position="0 1.6 0"></a-camera>
      </a-entity>

      <!-- Chão e céu -->
      <a-plane color="#5AA046" width="30" height="30" rotation="-90 0 0"></a-plane>
      <a-sky color="#AADDF0"></a-sky>

      <!-- Casa: a parede da frente fica em z = -5 e a casa vai até z = -11 -->
      <!-- Parede da frente, com o vão da porta (a porta tem 2 m de largura) -->
      <a-box position="-2.6 1.5 -5" width="3" height="3" depth="0.2" color="#CCCCCC"></a-box>
      <a-box position="2.7 1.5 -5" width="3" height="3" depth="0.2" color="#CCCCCC"></a-box>
      <a-box position="0.05 2.75 -5" width="2.3" height="0.5" depth="0.2" color="#CCCCCC"></a-box>
      <!-- Paredes dos lados e do fundo -->
      <a-box position="-4.1 1.5 -8" width="0.2" height="3" depth="6" color="#BBBBBB"></a-box>
      <a-box position="4.2 1.5 -8" width="0.2" height="3" depth="6" color="#BBBBBB"></a-box>
      <a-box position="0.05 1.5 -11" width="8.5" height="3" depth="0.2" color="#BBBBBB"></a-box>
      <!-- Telhado e chão de madeira -->
      <a-box position="0.05 3.1 -8" width="8.5" height="0.2" depth="6.2" color="#B43C28"></a-box>
      <a-plane position="0.05 0.01 -8" width="8.2" height="5.8" rotation="-90 0 0" color="#A0764A"></a-plane>

      <!-- Dentro da casa: uma mesa e uma luz, para se perceber que entrámos -->
      <a-box position="0 0.4 -9.5" width="1.5" height="0.8" depth="0.8" color="#6B4226"></a-box>
      <a-sphere position="0 0.95 -9.5" radius="0.15" color="#FFD700"></a-sphere>
      <a-light type="point" position="0 2.5 -8" intensity="0.8" distance="8"></a-light>

      <!-- Dobradiça: esta entidade roda e leva a porta com ela.
           O componente auto-door (em scripts.js) abre a porta quando a câmara se aproxima
           e leva o utilizador para dentro da casa (a posição "inside"). -->
      <a-entity
        id="hinge"
        position="-1 1.25 -5"
        auto-door="distance: 3; inside: 0 0 -8.5"
      >
        <!-- Poste preto da dobradiça -->
        <a-box width="0.2" height="2.5" depth="0.2" color="#000000"></a-box>
        <!-- A porta: desviada 1.1 m para a direita, para rodar pela ponta e não pelo centro -->
        <a-box position="1.1 0 0" width="2" height="2.5" depth="0.1" color="#654321"></a-box>
      </a-entity>

      <a-text
        value="Aproxima-te da porta (W A S D ou setas)"
        position="0.05 3.5 -4.8"
        align="center"
        color="#333333"
      ></a-text>
    </a-scene>

    <!-- código do projeto (componente auto-door), no fim da página -->
    <script src="scripts.js"></script>
  </body>
</html>
