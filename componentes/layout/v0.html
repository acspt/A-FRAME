<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <title>Layout (v0): A-Frame Registry</title>
    <!--
      Versão v0 do componente "Layout" (https://aframe.io/aframe-registry/)
      O conteúdo do BODY é o exemplo do README do componente (aframe-layout-component@5.3.0).
      Ajustes: position no círculo (no README fica centrado na câmara e as caixas ficam fora da vista).
    -->
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

<body>

      <a-entity geometry="primitive: box" material></a-entity>
      <a-entity geometry="primitive: box" material></a-entity>
      <a-entity geometry="primitive: box" material></a-entity>
      <a-entity geometry="primitive: box" material></a-entity>
      <a-entity geometry="primitive: box" material></a-entity>
      <a-entity geometry="primitive: box" material></a-entity>
      <a-entity geometry="primitive: box" material></a-entity>
      <a-entity geometry="primitive: box" material></a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
