<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <title>Line: A-Frame Registry</title>
    <!--
      Componente "Line" do A-Frame Registry (https://aframe.io/aframe-registry/)
      Desenha linhas entre dois pontos.
      Três linhas coloridas. (Mais tarde o componente line passou a fazer parte do A-Frame.)
    -->
    <script src="https://aframe.io/releases/0.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-line-component@1.0.0/dist/aframe-line-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-entity position="0 1.6 -4">
        <!-- start e end: pontos inicial e final da linha -->
        <a-entity line="start: -1 0 0; end: 1 1 1; color: #00F"></a-entity>
        <a-entity line="start: 0 1 0; end: 0 -1 1; color: #F00"></a-entity>
        <a-entity line="start: 1.5 1 0; end: 1 -1 1; color: #0A0"></a-entity>
      </a-entity>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
