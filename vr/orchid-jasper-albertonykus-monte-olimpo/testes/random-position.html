<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>A-Frame Click Interaction Example</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@^4.0.0/dist/aframe-event-set-component.min.js"></script>
    <script src="rotFollow.js"></script>
    <script src="randPos.js"></script>
  </head>
  
   
  <body>
    <a-scene>
      <!-- Camera -->
      <a-entity camera look-controls position="0 1.6 0"></a-entity>

      <!-- Interactive Object -->
      <a-box id="clickable-box" position="0 1.5 -3" rotation="0 45 0" color="#4CC3D9"
             toggle-spin></a-box>

      <!-- Object to appear -->
      <a-sphere id="appear-sphere" radius="0.5" color="#EF2D5E" visible="false"></a-sphere>

      <!-- Define positions -->
      <a-entity id="pos1" position="1 1 -2"></a-entity>
      <a-entity id="pos2" position="-1 1 -2"></a-entity>
      <a-entity id="pos3" position="0 2 -2"></a-entity>

      <!-- Cursor -->
      <a-entity cursor="rayOrigin: mouse"></a-entity>
    </a-scene>
  
    <!-- Bibliotecas usadas nesta página (clicar para abrir a lista) -->
    <details class="bibliotecas-usadas" style="position:fixed;bottom:10px;left:10px;z-index:9999;max-width:340px;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,0.7);color:#fff;font:12px/1.4 Arial,sans-serif">
      <summary style="cursor:pointer">&#8505;&#65039; Bibliotecas</summary>
      <ul style="margin:6px 0 0;padding-left:16px">
        <li><a href="https://aframe.io" target="_blank" rel="noopener" style="color:#87ceeb">A-Frame</a> 1.2.0</li>
        <li><a href="https://github.com/supermedium/superframe/tree/master/components/event-set" target="_blank" rel="noopener" style="color:#87ceeb">aframe-event-set-component</a></li>
      </ul>
    </details>
</body>
</html>
