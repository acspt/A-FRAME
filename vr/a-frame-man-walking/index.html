<!DOCTYPE html>
<html lang="pt">
  <head>
    <title>Homens a caminhar ao acaso</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- aframe-extras: componente animation-mixer, que corre a animação de caminhar do modelo -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@v7.4.0/dist/aframe-extras.min.js"></script>
    <!-- aframe-environment-component: cria o ambiente (floresta) -->
    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <!-- modelo CesiumMan (exemplos glTF da Khronos, CC BY 4.0, Cesium), com animação de caminhar -->
        <a-asset-item id="asset-man" src="assets/CesiumMan.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 1.2 3"></a-camera>

      <!-- Ambiente (floresta); hide-on-enter-ar esconde-o em AR -->
      <a-entity
        environment="preset: forest; lighting: none; shadow: none; lightPosition: 0 2.15 0"
        hide-on-enter-ar
      ></a-entity>

      <!-- Três homens; cada um caminha ao acaso (componente walking, em scripts.js).
           animation-mixer corre a animação de caminhar que vem dentro do modelo. -->
      <a-entity
        walking
        position="2 0 -1"
        gltf-model="#asset-man"
        animation-mixer
        shadow="cast: true; receive: false"
      ></a-entity>
      <a-entity
        walking="speed: 0.6"
        position="-2 0 -1"
        gltf-model="#asset-man"
        animation-mixer
        shadow="cast: true; receive: false"
      ></a-entity>
      <a-entity
        walking="speed: 1.2"
        position="0 0 -1"
        gltf-model="#asset-man"
        animation-mixer
        shadow="cast: true; receive: false"
      ></a-entity>

      <!-- Luzes -->
      <a-entity light="type: ambient; intensity: 0.5"></a-entity>
      <a-entity
        position="-5 3 1.5"
        light="type: directional;
               castShadow: true;
               shadowMapHeight: 1024;
               shadowMapWidth: 1024;
               shadowCameraLeft: -7;
               shadowCameraRight: 5;
               shadowCameraBottom: -5;
               shadowCameraTop: 5"
      ></a-entity>
    </a-scene>

    <!-- código do projeto (componente walking), no fim da página -->
    <script src="scripts.js"></script>
  </body>
</html>
