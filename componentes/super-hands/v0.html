<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <title>Super Hands (v0): A-Frame Registry</title>
    <!--
      Versão v0 do componente "Super Hands" (https://aframe.io/aframe-registry/)
      O conteúdo do BODY é o exemplo do README do componente (super-hands@3.0.6).
      Ajustes: position da caixa passa de 0 0 -1 para 0 1.6 -1 (à altura da câmara). Precisa de comandos VR: com o rato não se agarra (ver index.html).
    -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.misc.min.js"></script>
    <script src="https://unpkg.com/super-hands@3.0.6/dist/super-hands.min.js"></script>
  </head>
<body>
  <a-scene>
    <a-assets></a-assets>
    <a-entity>
      <a-camera></a-camera>
      <a-entity sphere-collider="objects: a-box" super-hands hand-controls="hand: left"></a-entity>
      <a-entity sphere-collider="objects: a-box" super-hands hand-controls="hand: right"></a-entity>
    </a-entity>
    <!-- hover & drag-drop won't have any obvious effect without some additional event handlers or components. See the examples page for more -->
    <a-box hoverable grabbable stretchable draggable droppable color="blue" position="0 1.6 -1"></a-box>
  </a-scene>
</body>
</html>
