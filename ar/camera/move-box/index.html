<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tocar e mover uma caixa em AR</title>
    <!-- A-Frame e AR.js em versões fixas -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <!-- arjs sourceType: webcam: a imagem da câmara aparece por trás da cena (sem marcador nem GPS) -->
    <!-- cursor rayOrigin: mouse: cliques do rato e toques no ecrã chegam às entidades como eventos click -->
    <!-- raycaster objects: .clicavel: só as entidades com esta classe recebem cliques -->
    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; debugUIEnabled: false;"
      cursor="rayOrigin: mouse"
      raycaster="objects: .clicavel"
    >
      <a-camera look-controls="enabled: true"></a-camera>

      <!-- A caixa, 1.5 m à frente do utilizador.
           agarrar (scripts.js): toca na caixa para a agarrar; ela segue o telemóvel; toca outra vez para a largar. -->
      <a-box
        class="clicavel"
        position="0 0 -1.5"
        width="0.5"
        height="0.5"
        depth="0.5"
        color="tomato"
        agarrar
      ></a-box>
    </a-scene>

    <!-- código do projeto (componente agarrar), no fim da página -->
    <script src="scripts.js"></script>
  </body>
</html>
