<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vídeos em AR: tocar para reproduzir</title>
    <!-- A-Frame e AR.js em versões fixas -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <!-- arjs sourceType: webcam: a imagem da câmara aparece por trás da cena (sem marcador nem GPS) -->
    <!-- cursor rayOrigin: mouse: cliques do rato e toques no ecrã chegam às entidades como eventos click -->
    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; debugUIEnabled: false;"
      cursor="rayOrigin: mouse"
      raycaster="objects: .clicavel"
    >
      <a-assets>
        <!-- vídeos de exemplo do A-Frame; playsinline: no iPhone o vídeo toca dentro da página -->
        <video id="video-coelho" src="https://cdn.aframe.io/videos/bunny.mp4"
               crossorigin="anonymous" loop playsinline preload="auto"></video>
        <video id="video-fogo" src="https://cdn.aframe.io/videos/fireworks.mp4"
               crossorigin="anonymous" loop playsinline preload="auto"></video>
      </a-assets>

      <a-camera look-controls="enabled: true"></a-camera>

      <!-- Dois ecrãs de vídeo (16:9), 3 m à frente, um de cada lado.
           tocar-video (scripts.js): toca no ecrã para reproduzir ou pausar o vídeo. -->
      <a-plane class="clicavel" width="1.6" height="0.9"
               position="-1 0 -3" rotation="0 20 0" material="shader: flat; src: #video-coelho" tocar-video></a-plane>
      <a-plane class="clicavel" width="1.6" height="0.9"
               position="1 0 -3" rotation="0 -20 0" material="shader: flat; src: #video-fogo" tocar-video></a-plane>

      <a-text value="Toca num video para o reproduzir ou pausar" align="center"
              position="0 0.8 -3" color="#FFFFFF" width="3"></a-text>
    </a-scene>

    <!-- código do projeto (componente tocar-video), no fim da página -->
    <script src="scripts.js"></script>
  </body>
</html>
