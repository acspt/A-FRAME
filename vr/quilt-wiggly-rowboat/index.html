<!DOCTYPE html>
<html>
  <head>
    <!-- Origem: backup do Glitch, projeto "quilt-wiggly-rowboat" (cópia de 2025-12-24 19:58) -->
    <meta charset="utf-8" />
    <title>Moving Camera in A-Frame</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="register.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Define the camera -->
      <a-camera
        id="camera"
        look-controls
        wasd-controls
       
      >
      </a-camera>

      <!-- Add some objects to the scene for reference -->
      <a-box position="0 0.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
      <a-sphere position="2 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
      <a-cylinder
        position="-1 0.75 -3"
        radius="0.5"
        height="1.5"
        color="#FFC65D"
      ></a-cylinder>
      <a-plane
        position="0 0 -4"
        rotation="-90 0 0"
        width="200"
        height="200"
        color="#7BC8A4"
      ></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>

    <script src="main.js"></script>
  </body>
</html>
