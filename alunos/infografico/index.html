<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Infográfico em AR: marcador Hiro</title>
    <!-- A-Frame e AR.js em versões fixas -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <!-- arjs sourceType: webcam: usa a câmara do dispositivo para procurar marcadores -->
    <!-- cursor rayOrigin: mouse: cliques do rato e toques no ecrã chegam às entidades como eventos click -->
    <!-- raycaster objects: .esfera: só as esferas recebem cliques -->
    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; debugUIEnabled: false;"
      cursor="rayOrigin: mouse"
      raycaster="objects: .esfera"
    >
      <!-- a-marker preset: hiro: procura o marcador Hiro.
           detetar-marcador (scripts.js): quando o deteta, põe visible = true, mostra a caixa
           e cria as esferas na cena. Fica vazio: o AR.js esconde tudo o que está dentro
           do marcador quando o deixa de ver. -->
      <a-marker preset="hiro" detetar-marcador></a-marker>

      <!-- A caixa está fora do marcador (diretamente na a-scene), para continuar visível
           depois de o marcador deixar de ser detetado.
           Começa escondida (visible="false"); o componente mostra-a. -->
      <a-box
        id="caixa"
        visible="false"
        position="0 0 -3"
        width="1"
        height="1"
        depth="1"
        color="tomato"
      ></a-box>

      <!-- câmara própria para AR (substitui a câmara normal do A-Frame) -->
      <a-entity camera></a-entity>
    </a-scene>

    <!-- código do projeto (componente detetar-marcador), no fim da página -->
    <script src="scripts.js"></script>
  </body>
</html>
