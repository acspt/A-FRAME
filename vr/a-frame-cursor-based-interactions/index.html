<!DOCTYPE html>
<html>
  <head>
    <title>Gaze-Based Interactions in A-Frame</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="script.js"></script>
    
  </head>
  <body>
 
    <a-scene>
      <!-- Camera -->
      <a-entity id="camera" camera look-controls>
        <a-cursor
          color="red"
          fuse="true"
          fuse-timeout="1500"
          raycaster="objects: .clickable"
        ></a-cursor>
      </a-entity>

      <!-- Clickable Objects -->
      <a-box id="box"
        class="clickable"
        rotate-on-gaze
        position="-1 0.5 -3"
        rotation="0 45 0"
        color="#4CC3D9"
        width="1"
        height="1"
        depth="1"
      ></a-box>
      <a-sphere id="sphere"
        class="clickable"
        rotate-on-gaze
        position="0 1.25 -5"
        radius="1.25"
        color="#EF2D5E"
      ></a-sphere>
      <a-cylinder id="cylinder"
        class="clickable"
        rotate-on-gaze
        position="1 0.75 -3"
        rotation="90 0 0"
        radius="0.5"
        height="1.5"
        color="#FFC65D"
      ></a-cylinder>

      <!-- Lighting -->
      <a-light type="ambient" color="#445451"></a-light>
      <a-light type="point" position="2 4 4" intensity="0.4"></a-light>

      <!-- Ground -->
      <a-plane 
        position="0 0 -4"
        rotation="-90 0 0"
        width="4"
        height="4"
        color="#7BC8A4"
      ></a-plane>
    </a-scene>
   
</body>
</html>
