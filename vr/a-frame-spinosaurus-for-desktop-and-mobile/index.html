<!DOCTYPE html>
<html lang="pt">
  <head>
    <title>Spinosaurus: computador e telemóvel</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- aframe-environment-component: cria o ambiente (floresta) -->
    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <!-- xr-mode-ui="enabled: false": esconde os botões de VR e AR (só computador e telemóvel) -->
    <a-scene xr-mode-ui="enabled: false">
      <a-assets timeout="30000">
        <!-- modelo do spinosaurus, na pasta assets deste exemplo -->
        <a-asset-item id="spinosaurus" src="assets/spinosaurus.glb"></a-asset-item>
      </a-assets>

      <!-- câmara à altura dos olhos de uma pessoa sentada; rodar arrastando o rato ou o dedo -->
      <a-camera position="0 1.2 0"></a-camera>

      <!-- Ambiente (floresta) -->
      <a-entity
        environment="preset: forest; lighting: none; shadow: none; lightPosition: 0 2.15 0"
      ></a-entity>

      <!-- O dinossauro; os botões mudam a escala desta entidade -->
      <a-entity id="dino" position="-1 0 -3" scale="0.5 0.5 0.5">
        <!-- y = -2.25: o centro deste modelo está acima das patas; assim as patas ficam no chão -->
        <a-entity
          position="0 -2.25 0"
          rotation="0 55 0"
          gltf-model="#spinosaurus"
          shadow="cast: true; receive: false"
        ></a-entity>
      </a-entity>

      <!-- Luzes: a direcional aponta para o dinossauro -->
      <a-entity light="type: ambient; intensity: 0.5"></a-entity>
      <a-entity
        id="light"
        position="-5 3 1.5"
        light="type: directional;
               target: #dino;
               castShadow: true;
               shadowMapHeight: 1024;
               shadowMapWidth: 1024;
               shadowCameraLeft: -7;
               shadowCameraRight: 5;
               shadowCameraBottom: -5;
               shadowCameraTop: 5"
      ></a-entity>
    </a-scene>

    <div id="text">
      <h1>A-Frame Spinosaurus para computador e telemóvel</h1>
      <p>
        Tamanho:
        <button id="btn_full">Inteiro</button>
        <button id="btn_half">1/2</button>
        <button id="btn_quarter">1/4</button>
      </p>
      <p class="creditos">
        Modelo:
        <a href="https://sketchfab.com/3d-models/spinosaurus-2135501583704537907645bf723685e7" target="_blank">Spinosaurus</a>,
        de <a href="https://sketchfab.com/VapTor" target="_blank">Vaptor-Studio</a>.
      </p>
    </div>

    <!-- código do projeto (botões de tamanho), no fim da página -->
    <script src="scripts.js"></script>
  </body>
</html>
