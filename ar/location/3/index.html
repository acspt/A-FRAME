<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Localização</title>
    <!-- estilos da página -->
    <link rel="stylesheet" href="styles.css" />
    <!-- A-Frame e AR.js (versão com localização) em versões fixas -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>
    <!-- biblioteca de física: deteta colisões entre entidades e lança o evento collide -->
    <script src="https://cdn.jsdelivr.net/npm/@c-frame/aframe-physics-system@4.2.4/dist/aframe-physics-system.min.js"></script>
    <!-- jQuery: usado em script.js, por isso tem de ser carregado antes dele -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- componentes próprios: têm de ser registados antes de a cena ser criada -->
    <script src="script.js"></script>
  </head>
  <body>
    <!-- sourceWidth/sourceHeight: resolução pedida à câmara; por omissão é 640x480, o que deixa o vídeo desfocado -->
    <!-- videoTexture: false: o vídeo aparece por trás da cena e mantém a proporção; com true era esticado e ficava deformado -->
    <!-- physics gravity 0: liga a física, sem gravidade (a esfera não cai) -->
    <a-scene
      physics="gravity: 0"
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; videoTexture: false; debugUIEnabled: false; sourceWidth: 1280; sourceHeight: 960;"
    >
      <!-- simulateLatitude/simulateLongitude substituem o GPS real: o utilizador fica sempre nesta posição -->
      <!-- static-body: corpo físico do utilizador, uma esfera com 4 m de raio à volta da câmara -->
      <a-camera
        gps-camera="simulateLatitude:  51.049; simulateLongitude: -0.723"
        rotation-reader
        static-body="shape: sphere; sphereRadius: 4"
      ></a-camera>
      <!-- esfera colocada numa latitude/longitude, perto da posição simulada -->
      <!-- não pode ter as mesmas coordenadas da câmara: ficaria a 0 m, dentro da câmara, e não se via -->
      <!-- latitude + 0.0001 fica cerca de 11 m para norte da câmara -->
      <!-- dynamic-body: corpo físico da esfera, com o mesmo raio da esfera (1 m) -->
      <!-- afastar-ao-colidir (script.js): quando colide com o corpo do utilizador (a menos de 5 m), a esfera afasta-se 1 m na direção câmara → esfera -->
      <a-sphere
        radius="1"
        color="#ff0000"
        gps-entity-place="latitude: 51.0491; longitude: -0.723;"
        dynamic-body="shape: sphere; sphereRadius: 1"
        afastar-ao-colidir
      ></a-sphere>
    </a-scene>
  </body>
</html>
