<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>A-Frame Multiple Scenes</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="script.js"></script>
  </head>
  <body>
    <!-- Scene 1 -->
    <a-scene id="scene1">
      <a-box position="0 1.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
      <a-sphere position="2 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
      <a-cylinder
        position="-1 0.75 -3"
        radius="0.5"
        height="1.5"
        color="#FFC65D"
      ></a-cylinder>
      <a-plane
        position="0 0 -4"
        rotation="-90 0 0"
        width="4"
        height="4"
        color="#7BC8A4"
      ></a-plane>
      <a-sky color="#ECECEC"></a-sky>
      <a-entity
        goto-scene2
        id="toScene2"
        geometry="primitive: plane; height: 0.5; width: 1"
        material="color: #FF0000"
        position="0 1 -2"
        text="value: Go to Scene 2; align: center"
        class="clickable"
      ></a-entity>
      <a-camera>
        <a-cursor></a-cursor>
      </a-camera>
    </a-scene>

    <!-- Scene 2 -->
    <a-scene id="scene2" visible="false">
      <a-box position="1 1.5 -3" rotation="0 45 0" color="#FF5733"></a-box>
      <a-sphere position="-2 1.25 -5" radius="1.25" color="#33FF57"></a-sphere>
      <a-cylinder
        position="1 0.75 -3"
        radius="0.5"
        height="1.5"
        color="#3357FF"
      ></a-cylinder>
      <a-plane
        position="0 0 -4"
        rotation="-90 0 0"
        width="4"
        height="4"
        color="#C8A47B"
      ></a-plane>
      <a-sky color="#ECECEC"></a-sky>
      <a-entity
        id="toScene1"
        geometry="primitive: plane; height: 0.5; width: 1"
        material="color: #0000FF"
        position="0 1 -2"
        text="value: Go to Scene 1; align: center"
        class="clickable"
      ></a-entity>
    </a-scene>
  </body>
</html>
