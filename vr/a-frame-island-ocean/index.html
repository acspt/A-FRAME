<html>
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,shrink-to-fit=no,user-scalable=no,maximum-scale=1"
    />
    <title>Examples • Island</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.4.0/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Camera -->
      <a-entity id="rig" movement-controls position="0 3.6 5">
        <a-entity
          id="camera"
          camera
          position="0 1.6 0"
          look-controls="pointerLockEnabled: true"
        ></a-entity>
      </a-entity>

      <!-- Island: built with A-Frame primitives, above the ocean (y = 3) -->
      <a-entity id="island" position="0 3 0">
        <!-- Sand -->
        <a-cylinder radius="7" height="1" position="0 0.1 0" color="#E6CD8C"></a-cylinder>
        <!-- Grass -->
        <a-cylinder radius="4.5" height="0.2" position="0 0.7 0" color="#5AA046"></a-cylinder>

        <!-- Hut -->
        <a-box width="2" height="1.6" depth="2" position="0 1.6 -1" color="#8C643C"></a-box>
        <a-box width="0.6" height="1" depth="0.05" position="0 1.3 0.01" color="#4A3020"></a-box>
        <a-cone radius-bottom="1.8" radius-top="0" height="1.2" position="0 3 -1" color="#B43C28"></a-cone>

        <!-- Palm tree -->
        <a-cylinder radius="0.15" height="3" position="2.5 2.3 0.5" color="#7A5230"></a-cylinder>
        <a-sphere radius="0.9" position="2.5 3.9 0.5" scale="1 0.4 1" color="#2E8B3A"></a-sphere>
      </a-entity>

      <!-- Ocean -->
      <a-ocean
        width="50"
        depth="50"
        density="40"
        opacity="1"
        position="0 3 0"
      ></a-ocean>

      <!-- Sky -->
      <a-sky color="#AADDF0"></a-sky>

      <!-- Lighting -->
      <a-light type="ambient" color="#ccc"></a-light>
      <a-light
        color="#ddf"
        distance="100"
        intensity="0.4"
        type="point"
      ></a-light>
      <a-light
        color="#ddf"
        position="3 10 -10"
        distance="50"
        intensity="0.4"
        type="point"
      ></a-light>
    </a-scene>
  
</body>
</html>
